<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 홈 화면에 추가해서 열면 주소창 없이 앱처럼 꽉 찬 화면으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="엥주 × 도비">
<title>엥주 × 도비 — 우리의 러브스토리</title>
<style>
  /* ============ 글로벌 톤앤매너: 동물의 숲 스타일 (GDD 2.1) ============ */
  :root{
    --cream:#FFF7E6;
    --paper:#FFFDF4;
    --wood:#8C6A4F;
    --brown:#5B4A3A;
    --leaf:#7FBF7F;
    --acorange:#E8A33D;
    --blush:#F2A6A0;
    --night:#2B2620;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--night);}
  body{
    font-family:'CozyRound','BM JUA','Jua',ui-rounded,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--brown);
    user-select:none;-webkit-user-select:none;
  }
  #game-canvas{position:fixed;inset:0;display:block;touch-action:none;}

  /* ---------- 공통 오버레이 ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50;}
  .hidden{display:none !important;}
  #fader{position:fixed;inset:0;background:var(--night);z-index:90;opacity:1;transition:opacity .8s ease;pointer-events:none;}
  #flash{position:fixed;inset:0;background:#fff;z-index:95;opacity:0;pointer-events:none;transition:opacity .12s ease;}

  /* ---------- 타이틀 ---------- */
  #title-screen-old{background:radial-gradient(ellipse at 50% 30%, #4a6b4a 0%, #2f4a35 55%, #22331f 100%);z-index:80;}
  .title-card{background:var(--paper);border-radius:32px;padding:36px 44px;text-align:center;
    box-shadow:0 12px 0 rgba(0,0,0,.18), inset 0 0 0 6px #F3E2BC;max-width:88vw;}
  .title-eyebrow{font-size:14px;letter-spacing:.2em;color:var(--acorange);margin-bottom:8px;}
  .title-main{font-size:clamp(30px,7vw,52px);color:var(--brown);line-height:1.15;}
  .title-main .amp{color:var(--blush);}
  .title-sub{margin-top:10px;font-size:14px;color:#9a8a76;}
  .btn{
    display:inline-block;margin-top:26px;background:var(--acorange);color:#fff;border:none;cursor:pointer;
    font-family:inherit;font-size:20px;padding:14px 40px;border-radius:999px;
    box-shadow:0 6px 0 #c07f1f;transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c07f1f;}
  .btn.ghost{background:#fff;color:var(--brown);box-shadow:0 6px 0 #d8c8ae;font-size:16px;padding:10px 26px;}
  .btn.ghost:active{box-shadow:0 2px 0 #d8c8ae;}

  /* ---------- 라운드 인트로 카드 ---------- */
  #round-intro{z-index:70;pointer-events:none;background:transparent;}
  .intro-card{background:rgba(255,253,244,.96);border-radius:26px;padding:24px 40px;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.15), inset 0 0 0 5px #F3E2BC;
    opacity:0;transform:scale(.9);transition:opacity .5s ease, transform .5s ease;}
  .intro-card.show{opacity:1;transform:scale(1);}
  .intro-date{font-size:15px;color:var(--acorange);letter-spacing:.12em;}
  .intro-loc{font-size:clamp(22px,5.5vw,34px);margin-top:6px;}

  /* ---------- 힌트 배너 ---------- */
  #hint{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(43,38,32,.88);color:#FFF3D6;font-size:14px;line-height:1.55;padding:10px 20px;
    border-radius:18px;z-index:40;width:max-content;max-width:min(560px,90vw);text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .4s ease;}

  /* ---------- 대사창 (동숲 스타일) ---------- */
  #dialogue-box{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));width:min(680px,92vw);z-index:60;cursor:pointer;}
  #dialogue-box.over-collage{z-index:87;}
  .speaker-plate{position:absolute;top:-18px;left:22px;background:var(--acorange);color:#fff;
    font-size:16px;padding:7px 20px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15);}
  .speaker-plate.engju{background:var(--blush);}
  .speaker-plate.system{background:#7c8fbf;}
  .dlg-body{background:var(--paper);border-radius:24px;padding:26px 24px 20px;min-height:96px;
    box-shadow:0 8px 0 rgba(0,0,0,.18), inset 0 0 0 5px #F3E2BC;font-size:clamp(16px,4.3vw,19px);line-height:1.55;}
  .dlg-body .direction{color:#a4917a;font-size:.85em;}
  .dlg-next{position:absolute;right:20px;bottom:12px;color:var(--acorange);font-size:18px;
    animation:bob 1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}

  /* ---------- 폴라로이드 팝업 ---------- */
  #photo-popup{background:rgba(30,26,22,.72);backdrop-filter:blur(3px);z-index:75;}
  .polaroid{background:#fff;padding:14px 14px 0;border-radius:6px;transform:rotate(-2.5deg);
    box-shadow:0 18px 40px rgba(0,0,0,.45);animation:drop .55s cubic-bezier(.2,1.4,.4,1);}
  @keyframes drop{from{transform:rotate(6deg) translateY(-60px) scale(.8);opacity:0;}
    to{transform:rotate(-2.5deg) translateY(0) scale(1);opacity:1;}}
  .polaroid img,.polaroid canvas{display:block;width:min(66vw,340px,64vh);height:auto;aspect-ratio:4/3;object-fit:cover;background:#eee;border-radius:2px;}
  .polaroid .cap{text-align:center;padding:12px 4px 16px;font-size:15px;color:#5B4A3A;}
  /* 세로사진: 4:3 프레임 안에 잘리지 않게 전체 표시, 남는 여백은 크림색 */
  img.portrait{object-fit:contain !important;background:#f6efe1 !important;}

  /* ---------- 추억 정원: 사진 묶음 ---------- */
  #bundle{background:rgba(30,26,22,.86);backdrop-filter:blur(3px);z-index:78;flex-direction:column;}
  .bd-title{color:var(--acorange);font-size:clamp(15px,4.2vw,20px);letter-spacing:.12em;margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  .bd-board{position:relative;width:min(94vw,640px,66vh);aspect-ratio:1/0.82;}
  .bd-photo{position:absolute;width:24%;background:#fff;padding:2.6% 2.6% 1.6%;border-radius:3px;
    box-shadow:0 10px 24px rgba(0,0,0,.45);cursor:pointer;opacity:0;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.8);
    transition:transform .35s cubic-bezier(.2,1.4,.4,1), opacity .35s ease;}
  .bd-photo.hero{width:44%;left:50%;top:50%;z-index:2;padding:2.2% 2.2% 1.2%;}
  .bd-photo img,.bd-photo canvas{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee;}
  .bd-photo .cap{text-align:center;padding:5px 2px 6px;font-size:clamp(10px,2.4vw,13px);color:#5B4A3A;}
  .bd-photo.in{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1);}
  .bd-photo.in-soft{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1);transition-duration:.8s;}
  .bd-closing{margin-top:10px;min-height:1.6em;color:#FFF3D6;font-size:clamp(15px,4.2vw,19px);text-align:center;max-width:86vw;line-height:1.55;
    opacity:0;transition:opacity .4s ease;}
  .bd-closing.show{opacity:1;}
  /* 마무리 문장이 사진 뒤에 가려지지 않도록 항상 사진보다 위에, 반투명 배경으로 표시 */
  .bd-closing{position:relative;z-index:5;margin-top:22px;padding:8px 18px;border-radius:14px;background:rgba(30,26,22,.72);}
  .bd-closing:empty{background:none;padding:0;}
  .bd-tip,#btn-bd-done{position:relative;z-index:5;}
  .bd-title{position:relative;z-index:5;margin-bottom:24px;}
  .bd-tip{color:rgba(255,243,214,.55);font-size:12px;margin-top:8px;}
  #btn-bd-done{margin-top:10px;}

  /* ---------- PNG 컷인 (감정 강조) ---------- */
  #cutin{position:fixed;bottom:calc(120px + env(safe-area-inset-bottom));z-index:64;pointer-events:none;
    transition:transform .45s cubic-bezier(.2,1.3,.4,1), opacity .35s ease;opacity:0;}
  #cutin.left{left:14px;transform:translateX(-40%) scale(.9);} #cutin.right{right:14px;transform:translateX(40%) scale(.9);}
  #cutin.show{opacity:1;transform:translateX(0) scale(1);}
  .cutin-card{position:relative;width:min(34vw,180px);border-radius:22px;overflow:hidden;background:#fff;border:4px solid #fff;
    box-shadow:0 14px 34px rgba(0,0,0,.45);}
  .cutin-card img{display:block;width:100%;height:auto;}
  .cutin-blush{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%, rgba(255,140,150,.30), transparent 55%);mix-blend-mode:multiply;}
  .cutin-heart{position:absolute;right:8px;top:6px;color:#ff6b8a;font-size:26px;text-shadow:0 2px 6px rgba(0,0,0,.25);animation:bob 1s ease-in-out infinite;}

  /* ---------- 영상편지 ---------- */
  #video-letter{background:rgba(20,16,12,.92);z-index:85;}
  .vl-frame{background:#fff;padding:14px;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .vl-frame video{display:block;width:min(88vw,560px);max-height:58vh;border-radius:4px;background:#000;}
  .vl-title{color:#FFF3D6;font-size:18px;margin-bottom:16px;}
  /* 실제 프로포즈 영상: 화면 전체를 채우고, 끝나면 축소+페이드 */
  #video-letter.vl-full{background:#000;transition:background .6s ease;}
  #video-letter.vl-full .vl-title{display:none;}
  #video-letter.vl-full .vl-frame{background:transparent;padding:0;border-radius:0;box-shadow:none;
    transition:transform .6s ease, opacity .6s ease;}
  #video-letter.vl-full .vl-frame video{width:100vw;height:100vh;max-height:100vh;object-fit:contain;border-radius:0;}
  #video-letter.vl-full .vl-missing{width:min(92vw,720px);}
  #video-letter.vl-full .row{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));margin:0;}
  #video-letter.vl-full .row .btn{opacity:.55;padding:6px 12px;font-size:13px;}
  #video-letter.vl-out{background:rgba(0,0,0,0);}
  #video-letter.vl-out .vl-frame{transform:scale(.88);opacity:0;}
  #video-letter.vl-out .row{opacity:0;transition:opacity .3s;}
  .vl-missing{width:min(88vw,560px,100vh);aspect-ratio:16/9;border-radius:4px;background:#1d1a16;color:#cbb894;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:14px;line-height:1.7;padding:20px;border:2px dashed #6b5c45;}
  .vl-missing b{color:#FFF3D6;font-size:16px;}
  .vl-missing code{background:#2e281f;padding:2px 8px;border-radius:6px;font-family:monospace;font-size:13px;color:#f0c674;}

  /* ---------- 피날레 시스템 알림 ---------- */
  #final-notice{z-index:82;background:transparent;pointer-events:none;justify-content:flex-end;padding-bottom:calc(30px + env(safe-area-inset-bottom));}
  .notice-card{pointer-events:auto;background:rgba(255,253,244,.97);border-radius:26px;padding:26px 34px;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.2), inset 0 0 0 5px #F3E2BC;max-width:90vw;
    animation:noticePulse 2.2s ease-in-out infinite;}
  @keyframes noticePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
  .notice-eyebrow{font-size:13px;color:#7c8fbf;letter-spacing:.18em;margin-bottom:8px;}
  .notice-main{font-size:clamp(19px,5vw,26px);line-height:1.5;}
  .notice-sub{margin-top:14px;font-size:13px;color:#a4917a;}
  /* ---------- 별똥별 소원 ---------- */
  #wish{position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.9);z-index:65;
    background:rgba(18,15,32,.85);border:2px solid rgba(255,220,150,.65);border-radius:22px;
    padding:22px 36px;box-shadow:0 0 34px rgba(255,215,140,.45), inset 0 0 18px rgba(255,220,150,.12);
    color:#FFF6DC;font-size:clamp(19px,5vw,30px);text-align:center;width:max-content;max-width:min(92vw,720px);
    box-sizing:border-box;word-break:keep-all;line-height:1.6;
    text-shadow:0 0 14px rgba(255,220,150,.9), 0 2px 4px rgba(0,0,0,.6);
    opacity:0;transition:opacity .45s ease, transform .45s ease;pointer-events:none;}
  #wish.show{opacity:1;transform:translateX(-50%) scale(1);}
  #star-cue{position:fixed;left:-100px;top:-100px;transform:translate(-50%,-135%);z-index:66;
    color:#FFE9A8;font-size:clamp(14px,3.8vw,18px);font-weight:700;white-space:nowrap;pointer-events:none;
    text-shadow:0 0 10px rgba(255,220,150,.95), 0 2px 4px rgba(0,0,0,.7);
    opacity:0;transition:opacity .25s ease;}
  #star-cue.show{opacity:1;animation:cueBob .7s ease-in-out infinite;}
  @keyframes cueBob{0%,100%{margin-top:0;}50%{margin-top:7px;}}

  /* ---------- 평생 주민권 증서 ---------- */
  #certificate{background:rgba(25,20,16,.8);backdrop-filter:blur(3px);z-index:83;}
  .cert{position:relative;background:#FFFBEE;border-radius:14px;padding:34px 30px 30px;max-width:min(88vw,440px);text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);border:3px solid #D9B65C;outline:2px solid #F3E2BC;outline-offset:-9px;
    animation:drop .55s cubic-bezier(.2,1.4,.4,1);}
  .cert-title{font-size:clamp(20px,5.5vw,26px);color:#8a6a20;letter-spacing:.08em;}
  .cert-name{font-size:clamp(26px,7vw,36px);margin-top:14px;color:var(--brown);}
  .cert-role{margin-top:6px;color:#a4917a;font-size:14px;}
  .cert-body{margin-top:16px;font-size:14px;line-height:1.7;color:var(--brown);}
  .cert-foot{margin-top:22px;display:flex;justify-content:space-between;font-size:12.5px;color:#a4917a;gap:10px;flex-wrap:wrap;}
  .stamp{position:absolute;right:16px;bottom:50px;width:76px;height:76px;border:4px solid rgba(217,83,79,.85);
    border-radius:50%;color:rgba(217,83,79,.92);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;
    transform:rotate(-14deg) scale(3);opacity:0;line-height:1.25;text-align:center;}
  .stamp.in{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes stampIn{from{transform:rotate(-32deg) scale(3);opacity:0;}to{transform:rotate(-14deg) scale(1);opacity:1;}}

  /* ---------- 엔딩 크레딧 ---------- */
  #credits{background:linear-gradient(180deg,#171310 0%, #241d16 100%);z-index:84;overflow:hidden;}
  #credits-col{position:absolute;left:50%;top:0;width:min(90vw,540px);transform:translate(-50%,100vh);text-align:center;}
  .cr-line{color:#FFF3D6;font-size:clamp(16px,4.5vw,21px);margin:28px 0;line-height:1.5;}
  .cr-line.end{color:#F2A6A0;margin-top:64px;font-size:clamp(18px,5vw,24px);}
  .cr-line.wedding{color:#FFD98A;margin-top:56px;font-size:clamp(17px,4.8vw,23px);letter-spacing:.04em;
    text-shadow:0 0 16px rgba(255,215,140,.55);}

  /* ---------- 하트 콜라주 (피날레 · 소용돌이 뒤) ---------- */
  #heart-collage{background:rgba(24,19,15,.92);backdrop-filter:blur(3px);z-index:80;
    flex-direction:column;transition:filter .6s ease;}
  #heart-collage.dim #hc-board{filter:brightness(.75) saturate(.9);transition:filter .6s ease;}
  #heart-collage.dim .hc-title{opacity:.6;}
  .hc-title{color:#FFF3D6;font-size:clamp(16px,4.6vw,22px);text-align:center;line-height:1.5;
    margin-bottom:8px;max-width:88vw;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  #hc-board{position:relative;width:min(92vw,560px,62vh);aspect-ratio:1/0.95;}
  .hc-photo{position:absolute;width:23%;background:#fff;padding:3.2% 3.2% 5.5%;border-radius:3px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);cursor:pointer;opacity:0;
    animation:hcDrop .55s cubic-bezier(.2,1.4,.4,1) forwards;}
  .hc-photo img,.hc-photo canvas{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee;}
  @keyframes hcDrop{from{opacity:0;margin-top:-26px;}to{opacity:1;margin-top:0;}}
  .hc-tip{color:rgba(255,243,214,.6);font-size:12.5px;margin-top:10px;}
  #hc-viewer{position:fixed;inset:0;background:rgba(15,12,9,.9);z-index:86;display:flex;
    flex-direction:column;align-items:center;justify-content:center;}
  #hc-viewer.hidden{display:none;}
  .hcv-photo{background:#fff;padding:14px 14px 0;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.55);
    animation:drop .4s cubic-bezier(.2,1.4,.4,1);touch-action:pan-y;}
  .hcv-photo img,.hcv-photo canvas{display:block;width:min(76vw,420px,60vh);aspect-ratio:4/3;object-fit:cover;background:#eee;border-radius:2px;}
  .hcv-cap{text-align:center;padding:12px 4px 16px;font-size:15px;color:#5B4A3A;max-width:min(76vw,420px);}
  .hcv-cap2{margin-top:6px;font-size:13px;color:#8a7a66;line-height:1.5;}
  .hcv-nav{display:flex;gap:14px;align-items:center;margin-top:20px;}
  .hcv-nav .btn{padding:10px 22px;}
  .hcv-count{color:#FFF3D6;font-size:13px;min-width:52px;text-align:center;}
  .hcv-tip{color:rgba(255,243,214,.55);font-size:12px;margin-top:12px;}
  .cr-photos{display:flex;justify-content:center;gap:18px;margin:20px 0;flex-wrap:wrap;}
  .cr-photo{display:flex;justify-content:center;}
  .cr-photos .cr-photo:nth-child(2n) img,.cr-photos .cr-photo:nth-child(2n) canvas{transform:rotate(2.5deg);}
  .cr-photo img,.cr-photo canvas{width:min(46vw,220px);aspect-ratio:4/3;object-fit:cover;background:#fff;
    padding:8px 8px 22px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 10px 26px rgba(0,0,0,.5);box-sizing:content-box;}
  .cr-tip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,243,214,.4);font-size:12px;}

/* ---------- 큰 화면(TV·PC 브라우저로 직접 열람) 대응 ----------
   폰 미러링/캐스팅은 화면 그대로 확대되는 것이라 문제없지만,
   실제로 넓은 뷰포트에서 브라우저를 여는 경우엔 아래 규칙으로
   텍스트·박스가 자동으로 커져서 소파 거리에서도 읽기 편해짐. */
@media (min-width: 900px){
  .title-main{font-size:clamp(52px,4.8vw,84px);}
  .intro-loc{font-size:clamp(30px,3vw,44px);}
  #dialogue-box{width:min(880px,60vw);}
  .dlg-body{font-size:clamp(20px,2.1vw,26px)!important;}
  .mont-cap{font-size:clamp(19px,2vw,25px);max-width:60vw;}
  .mont-photo img,.mont-photo canvas{width:min(420px,32vw);}
  .polaroid img,.polaroid canvas{width:min(400px,30vw);}
  .vl-frame video,.vl-missing{width:min(720px,55vw);}
  .notice-main{font-size:clamp(28px,2.6vw,38px);}
  #wish{font-size:clamp(26px,2.6vw,40px);max-width:min(70vw,900px);}
  .cert{max-width:min(560px,42vw);padding:44px 40px 38px;}
  .cert-title{font-size:clamp(26px,2.6vw,32px);}
  .cert-name{font-size:clamp(32px,3.4vw,44px);}
  .cert-body{font-size:clamp(16px,1.6vw,19px)!important;}
  .cr-line{font-size:clamp(20px,2.2vw,27px);}
  .cr-line.end{font-size:clamp(23px,2.5vw,30px);}
  .cr-line.wedding{font-size:clamp(21px,2.3vw,28px);}
  #credits-col{width:min(720px,54vw);}
  .hc-title{font-size:clamp(20px,2.2vw,27px);}
  #hc-board{width:min(760px,58vw,64vh);}

  #title-screen .ti-glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 64%, rgba(255,197,111,.16), transparent 27%),
      radial-gradient(circle at 78% 66%, rgba(255,176,89,.10), transparent 19%);
    animation:tiBreathe 5.5s ease-in-out infinite;}
  #title-screen .ti-vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 46%, rgba(7,12,25,.18) 78%, rgba(7,12,25,.44) 115%),
      linear-gradient(to bottom, rgba(7,12,25,.14), transparent 18%, transparent 80%, rgba(7,12,25,.22));}
  #title-screen canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #ti-snowBack{opacity:.52;} #ti-snowFront{opacity:.9;}
  #btn-start.ti-start{position:absolute;left:50%;top:86%;transform:translate(-50%,-50%);margin:0;
    min-width:256px;height:62px;padding:0 28px;border:1px solid rgba(255,255,255,.56);border-radius:999px;
    background:linear-gradient(180deg,rgba(255,247,244,.97),rgba(255,226,218,.95));
    box-shadow:0 14px 40px rgba(76,48,43,.24), inset 0 1px 0 rgba(255,255,255,.96);
    color:#7a3528;font-family:inherit;font-size:clamp(17px,1.35vw,22px);font-weight:800;letter-spacing:-.03em;
    cursor:pointer;transition:transform .24s ease, box-shadow .24s ease, filter .24s ease, opacity .45s ease;}
  #btn-start.ti-start:hover{transform:translate(-50%,-53%) scale(1.025);filter:brightness(1.035);
    box-shadow:0 18px 46px rgba(76,48,43,.28), inset 0 1px 0 rgba(255,255,255,.96), 0 0 34px 8px rgba(255,216,166,.22);}
  #btn-start.ti-start span{margin-left:13px;font-size:1.2em;}
  #title-screen .ti-hint{position:absolute;left:50%;bottom:2.7vh;transform:translateX(-50%);
    color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.08em;text-shadow:0 2px 8px rgba(0,0,0,.35);opacity:.72;}
  #title-screen .ti-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;opacity:0;pointer-events:none;text-shadow:0 3px 18px rgba(0,0,0,.45);text-align:center;}
  #title-screen .ti-card .ti-date{font-size:13px;letter-spacing:.22em;opacity:.75;margin-bottom:14px;}
  #title-screen .ti-card h2{margin:0;font-size:clamp(34px,6vw,78px);font-weight:800;letter-spacing:-.055em;}
  #title-screen .ti-card p{margin:12px 0 0;font-size:clamp(14px,1.2vw,20px);opacity:.84;}
  #title-screen.playing .ti-start,#title-screen.playing .ti-hint{opacity:0;pointer-events:none;}
  #title-screen.playing .ti-plate{animation:tiPush 4.2s cubic-bezier(.2,.75,.18,1) forwards;}
  #title-screen.playing .ti-glow{animation:tiGlow 4.2s ease forwards;}
  #title-screen.playing .ti-card{animation:tiCard 4.7s ease forwards;}
  #title-screen.playing canvas{animation:tiSnow 4.2s ease forwards;}
  @keyframes tiBreathe{0%,100%{opacity:.72}50%{opacity:1}}
  @keyframes tiPush{
    0%{transform:translate3d(calc(var(--px) * -0.16),calc(var(--py) * -0.10),0) scale(1.02);filter:saturate(1.03) contrast(1.02) blur(0);}
    55%{transform:translate3d(calc(var(--px) * -0.05),2.5%,0) scale(1.22);filter:saturate(1.08) contrast(1.035) blur(.15px);}
    100%{transform:translate3d(0,8.3%,0) scale(1.58);filter:saturate(.92) brightness(.62) blur(1.7px);}}

/* ================================================================
   이하 게임 엔진 코드 — 데이터를 읽어 재생만 합니다.
   ================================================================ */
(function(){
"use strict";
const $ = id => document.getElementById(id);

/* ---------------- 관리자 채널(admin.html) 연동 ----------------
   · 설정(JSON)      : localStorage "ED_GAME_DATA"
   · 업로드한 파일들 : IndexedDB "ED_STUDIO" / store "assets"
   관리자 페이지에서 저장하면 게임을 새로고침할 때 자동 반영됩니다.
   저장된 게 없으면 위의 GAME_DATA 기본값 + assets/ 폴더를 사용합니다. */
const LS_KEY = "ED_GAME_DATA", DB_NAME = "ED_STUDIO", DB_STORE = "assets";
let D, CFG, BASE;
const ASSETS = {};                       // 업로드 파일명 → objectURL
/* 파일명만 적으면 확장자에 따라 assets/images · audio · video · models 하위 폴더로 찾아갑니다.
   ("images/x.png"처럼 폴더를 직접 적으면 assets/ 아래 그 경로를 그대로 사용) */
const EXT_FOLDER = { png:"images", jpg:"images", jpeg:"images", webp:"images", gif:"images",
                     mp3:"audio", wav:"audio", ogg:"audio", m4a:"audio",
                     mp4:"video", webm:"video", mov:"video",
                     glb:"models", gltf:"models", ttf:"fonts", otf:"fonts", woff:"fonts", woff2:"fonts" };
function url(f){
  if(!f) return "";
  if(ASSETS[f]) return ASSETS[f];
  if(/^(https?:|data:|blob:|\/)/.test(f)) return f;
  if(f.indexOf("/")>=0) return BASE + f;
  const ext=(f.split(".").pop()||"").toLowerCase();
  const kind=EXT_FOLDER[ext];
  const folders=(CFG && CFG.folders)||{};
  const sub = kind ? (folders[kind]!==undefined ? folders[kind] : kind+"/") : "";
  return BASE + sub + f;
}

function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=>{ const db=r.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function loadUploadedAssets(){
  try{
    const db = await idbOpen();
    await new Promise(res=>{
      const st = db.transaction(DB_STORE,"readonly").objectStore(DB_STORE);
      const req = st.openCursor();
      req.onsuccess = e=>{
        const c = e.target.result;
        if(c){
          const v = c.value;
          const blob = (v && v.blob) ? v.blob : v;
          if(blob instanceof Blob) ASSETS[c.key] = URL.createObjectURL(blob);
          c.continue();
        } else res();
      };
      req.onerror = ()=>res();
    });
  }catch(e){ /* IndexedDB 미지원/차단 시 기본 assets/ 폴더 사용 */ }
}
function fillDefaults(obj){
  obj.config = obj.config || {};
  obj.config.assetBase = obj.config.assetBase || GAME_DATA.config.assetBase;
  obj.config.sfx = Object.assign({}, GAME_DATA.config.sfx, obj.config.sfx||{});
  obj.config.font = obj.config.font || GAME_DATA.config.font;
  obj.config.birthdaySong = obj.config.birthdaySong || GAME_DATA.config.birthdaySong;
  obj.config.models = Object.assign({}, GAME_DATA.config.models, obj.config.models||{});
  obj.config.folders = Object.assign({}, GAME_DATA.config.folders, obj.config.folders||{});
  obj.config.cutins = Object.assign({}, GAME_DATA.config.cutins, obj.config.cutins||{});
  obj.config.introImage = obj.config.introImage || GAME_DATA.config.introImage;
  obj.config.titleBgm = obj.config.titleBgm || GAME_DATA.config.titleBgm;
  obj.videos = Object.assign({}, GAME_DATA.videos, obj.videos||{});
  obj.videoLetter = Object.assign({}, GAME_DATA.videoLetter, obj.videoLetter||{});
  obj.montages = obj.montages || [];
  obj.starfall = obj.starfall || GAME_DATA.starfall;
  obj.certificate = obj.certificate || GAME_DATA.certificate;
  obj.credits = obj.credits || GAME_DATA.credits;
  return obj;
}
/* 설정 우선순위:
   1) 이 브라우저의 관리자 저장본(localStorage) — 단, 데이터 구조 버전이 같을 때만
   2) 코드에 내장된 기본값(GAME_DATA) */
function loadSavedData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const obj = JSON.parse(raw);
      if(obj && obj.episodes && obj.flow && obj.version === GAME_DATA.version) return fillDefaults(obj);
      if(obj && obj.version !== GAME_DATA.version)
        console.info("[E&D] 관리자 저장본의 데이터 버전이 달라 내장 기본값을 사용합니다.");
    }
  }catch(e){}
  return GAME_DATA;
}

/* ---------------- 오디오 ---------------- */
let actx = null;
const bgmEl = { cur:null };
const sfxFiles = {};
// 첫 에피소드 BGM은 Story Start 클릭 순간 무음으로 미리 재생해 브라우저의
// 자동재생 제한을 확실히 해제한다. (타이틀 음악은 그대로 들림)
let primedBGM = null, primedBGMFile = null;
let pendingBGMRetry = null;
function initAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  // 지정된 SFX 파일 로드 시도 (없으면 내장 사운드로 대체)
  for(const k in CFG.sfx){
    if(!CFG.sfx[k]) continue;
    const a = new Audio(url(CFG.sfx[k]));
    a.addEventListener("canplaythrough", ()=>{ sfxFiles[k]=a; }, {once:true});
    a.addEventListener("error", ()=>{}, {once:true});
    a.load();
  }
}
/* 오디오 볼륨 페이드 / 장면별 BGM 연출 */
bgmEl.file = null;
bgmEl.baseVolume = .45;   // 대사 덕킹 후 돌아올 기준 볼륨

function fadeAudio(a, to, ms, then){
  return new Promise(resolve=>{
    if(!a){ if(then) then(); resolve(); return; }
    const from = a.volume, t0 = performance.now();
    const dur = Math.max(1, ms||1);
    (function step(){
      const k = Math.min(1, (performance.now()-t0)/dur);
      a.volume = Math.min(1, Math.max(0, from + (to-from)*k));
      if(k < 1) requestAnimationFrame(step);
      else{ if(then) then(); resolve(); }
    })();
  });
}
function retryPlayOnGesture(a, file){
  if(pendingBGMRetry){
    removeEventListener("pointerdown", pendingBGMRetry);
    pendingBGMRetry=null;
  }
  const retry=()=>{
    pendingBGMRetry=null;
    const p=a.play();
    if(p && p.catch) p.catch(()=>{});
  };
  pendingBGMRetry=retry;
  addEventListener("pointerdown", retry, {once:true});
  console.warn("[E&D] BGM 재생이 브라우저 정책으로 보류됨. 다음 탭에서 재시도:", file);
}
function primeBGM(file){
  if(!file) return;
  if(primedBGM){ try{ primedBGM.pause(); }catch(e){} }
  const a=new Audio(url(file));
  a.preload="auto"; a.loop=true; a.volume=0;
  a.addEventListener("error", ()=>console.warn("[E&D] BGM 파일을 찾지 못함:", url(file)), {once:true});
  // 반드시 사용자 클릭 핸들러 안에서 호출됨
  const p=a.play();
  if(p && p.catch) p.catch(()=>retryPlayOnGesture(a,file));
  primedBGM=a; primedBGMFile=file;
}

/* opt: volume / fadeMs / crossfadeMs / loop
   장면 전환은 짧게, 감정 장면은 길게. */
function playBGM(file, opt){
  opt=opt||{};
  const volume = opt.volume!=null ? opt.volume : .45;
  const fadeMs = opt.fadeMs!=null ? opt.fadeMs : 950;
  const crossfadeMs = opt.crossfadeMs!=null ? opt.crossfadeMs : fadeMs;

  // 같은 곡이면 재시작하지 않고 목표 볼륨만 조절
  if(file && bgmEl.cur && bgmEl.file===file){
    bgmEl.baseVolume=volume;
    fadeAudio(bgmEl.cur, volume, fadeMs);
    return bgmEl.cur;
  }

  const old = bgmEl.cur;
  bgmEl.cur = null; bgmEl.file = null;
  if(old) fadeAudio(old, 0, crossfadeMs, ()=>old.pause());
  if(!file) return null;

  let a;
  if(primedBGM && primedBGMFile===file){
    a=primedBGM; primedBGM=null; primedBGMFile=null;
    try{ a.currentTime=0; }catch(e){}
  }else{
    a = new Audio(url(file));
  }
  a.loop = opt.loop!==false;
  a.volume = 0;
  a.addEventListener("error", ()=>console.warn("[E&D] BGM 파일을 찾지 못함:", url(file)), {once:true});
  if(a.paused){
    const p=a.play();
    if(p && p.catch) p.catch(()=>retryPlayOnGesture(a,file));
  }
  bgmEl.cur = a;
  bgmEl.file = file;
  bgmEl.baseVolume = volume;
  fadeAudio(a, volume, fadeMs);
  return a;
}

function tone(freq, dur, type, vol, slide){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"square"; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime+dur);
  g.gain.setValueAtTime(vol||0.05, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur);
}
function sfx(name){

  if(name==="typing")  tone(300+Math.random()*260, .07, "square", .04);
  if(name==="click")   tone(620, .09, "sine", .06, 240);
  if(name==="shutter"){
    if(!actx) return;
    const len = actx.sampleRate*0.12, buf = actx.createBuffer(1,len,actx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);

    g.gain.value=.3; s.buffer=buf; s.connect(g); g.connect(actx.destination); s.start();
    tone(1200,.05,"square",.05);
  }
}

function altExt(file){                    // photo.jpg ↔ photo.png 확장자 대체 후보

/* 파일이 실제로 있는지 확인 (같은 날짜의 _1, _2 사진 자동 탐색용) — 결과는 캐시 */
const PHOTO_PROBE = {};
function probePhoto(file){
  if(!file) return Promise.resolve(false);
  if(PHOTO_PROBE[file]!==undefined) return Promise.resolve(PHOTO_PROBE[file]);
  return new Promise(res=>{
    const img=new Image(); let triedAlt=false;
    img.onload=()=>{ PHOTO_PROBE[file]=true; res(true); };
    img.onerror=()=>{ const alt=altExt(file); if(alt && !triedAlt){ triedAlt=true; img.src=url(alt); return; } PHOTO_PROBE[file]=false; res(false); };
    img.src=url(file);
  });
}
/* [{file,label,caption,...}] → 같은 날짜의 photo_YYYYMMDD_1.jpg, _2.jpg 가 있으면 뒤에 끼워 넣음 */
async function expandPhotos(list){
  const out=[];
  for(const ph of list){
    out.push(ph);
    const m=/^(.*?)(\.[a-z0-9]+)$/i.exec(ph.file||""); if(!m) continue;
    for(let n=1;n<=3;n++){
      const extra=m[1]+"_"+n+m[2];
      if(!(await probePhoto(extra))) break;
      out.push(Object.assign({}, ph, {file:extra, extraOf:ph.file}));
    }
  }
  return out;
}

/* 3D 공간에 붙는 사진: 세로사진은 잘리지 않게 전체 표시(틀 안에 가운데 정렬), 가로사진은 틀을 꽉 채움(cover).
   mesh 는 (w × h) 크기의 PlaneGeometry 로 만든 것을 넘겨 주세요. */
function fitPhotoTexture(mesh, tex, w, h){
  const im = tex && tex.image; const iw = im && (im.naturalWidth||im.width), ih = im && (im.naturalHeight||im.height);
  if(!iw || !ih) return;
  const a = iw/ih, boxA = w/h;
  if(a < 0.95){                                   // 세로: contain — 틀보다 좁아지도록 줄임 (뒤 흰 액자 위에 가운데 정렬)
    const fitW = Math.min(1, a/boxA);
    mesh.scale.x = fitW;
  }else if(a > boxA){                             // 틀보다 더 가로로 긴 사진: 좌우를 잘라 채움
    tex.repeat.x = boxA/a; tex.offset.x = (1-tex.repeat.x)/2;
  }else{                                          // 틀보다 덜 가로로 긴 사진(정사각 등): 위아래를 잘라 채움
    tex.repeat.y = a/boxA; tex.offset.y = (1-tex.repeat.y)/2;
  }
  tex.needsUpdate = true;
}

}

/* ---- 쿼터뷰 카메라: 드래그 360도 회전 + 휠/핀치 줌 (GDD 2.1) ---- */
const orbit = { theta: Math.PI/4, phi: Math.PI/3.4, radius: 9, target: new THREE.Vector3(0,1,0) };
function applyOrbit(){
  const {theta, phi, radius, target} = orbit;
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
/* 원하는 카메라 위치·바라볼 지점을 orbit 파라미터로 환산해 적용 */
function orbitLookFrom(camPos, lookAt){
  const off = camPos.clone().sub(lookAt);
  orbit.radius = off.length();
  orbit.phi    = Math.acos(Math.min(1, Math.max(-1, off.y/orbit.radius)));
  orbit.theta  = Math.atan2(off.x, off.z);
  orbit.target.copy(lookAt);
}
/* 플레이어 카메라 조작은 '탐색·상호작용 대기' 상태에서만 허용.
   자동 연출·대사·캐릭터 이동 중에는 camFree=false 로 잠깁니다. (자동 연출용 카메라는 radius 3까지 접근 가능) */
let camFree=false;
let dragging=false, moved=0, lastX=0, lastY=0, pinchDist=0;
canvas.addEventListener("pointerdown", e=>{ dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; });
addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved += Math.abs(dx)+Math.abs(dy);
  lastX=e.clientX; lastY=e.clientY;
  if(!camFree) return;
  orbit.theta -= dx*0.006;
  orbit.phi = Math.min(Math.PI/2.05, Math.max(0.5, orbit.phi - dy*0.005));
});
addEventListener("pointerup", e=>{
  if(dragging && moved < 8) handleTap(e.clientX, e.clientY);
  dragging=false;
});
canvas.addEventListener("wheel", e=>{
  if(!camFree) return;
  orbit.radius = Math.min(16, Math.max(4.5, orbit.radius + e.deltaY*0.01));
}, {passive:true});
canvas.addEventListener("touchmove", e=>{
  if(e.touches.length===2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDist && camFree) orbit.radius = Math.min(16, Math.max(4.5, orbit.radius + (pinchDist-d)*0.02));
    pinchDist = d;
  }
}, {passive:true});
/* 카메라 상태를 orbit 파라미터로 tween (자동 연출용). to: {theta,phi,radius,tx,ty,tz} 중 필요한 것만 */
function camTween(to, dur, ease){
  const o0={theta:orbit.theta, phi:orbit.phi, radius:orbit.radius, tx:orbit.target.x, ty:orbit.target.y, tz:orbit.target.z};
  const oT=Object.assign({}, o0, to);
  return tweenP(dur, k=>{
    orbit.theta  = o0.theta + (oT.theta-o0.theta)*k;
    orbit.phi    = o0.phi   + (oT.phi  -o0.phi  )*k;
    orbit.radius = o0.radius+ (oT.radius-o0.radius)*k;
    orbit.target.set(o0.tx+(oT.tx-o0.tx)*k, o0.ty+(oT.ty-o0.ty)*k, o0.tz+(oT.tz-o0.tz)*k);
  }, ease);
}
/* 카메라 위치·주시점으로 tween (orbitLookFrom의 tween 버전) */
function camLookTween(camPos, lookAt, dur, ease){
  const off=camPos.clone().sub(lookAt), r=off.length();
  return camTween({ radius:r, phi:Math.acos(Math.min(1,Math.max(-1,off.y/r))), theta:Math.atan2(off.x,off.z),
                    tx:lookAt.x, ty:lookAt.y, tz:lookAt.z }, dur, ease);
}
function camSnapshot(){ return {theta:orbit.theta, phi:orbit.phi, radius:orbit.radius, tx:orbit.target.x, ty:orbit.target.y, tz:orbit.target.z}; }

    p.v.y -= 0.6*dt;
    p.s.material.opacity = Math.max(0, 1-p.age/p.life);

  },

function makeCharV2(opt){
  opt = opt||{};
  const role = opt.role || (opt.isEngju ? "engju" : "dobby");
  const isEngju = role==="engju";
  const season = opt.season || "neutral";
  const col = Object.assign({}, SEASON_OUTFITS[role][season] || SEASON_OUTFITS[role].neutral);
  ["outfit","sleeve","pants","shoes","collar","scarf"].forEach(k=>{ if(opt[k]) col[k]=opt[k]; });
  if(opt.outfit && !opt.sleeve) col.sleeve = opt.outfit;
  const skin = opt.skin || (isEngju ? "#ffe3c9" : "#ffe4cb");
  const hair = opt.hair || (isEngju ? "#24201e" : "#5c3d26");
  const mat = c => new THREE.MeshToonMaterial({color:c});
  const flat = (c,o) => new THREE.MeshBasicMaterial(Object.assign({color:c}, o||{}));
  const P = {};
  const g = new THREE.Group();
  g.userData.parts = P; g.userData.role = role; g.userData.expression = "normal";
  g.userData.headBase = .12;                       // 기본 고개 각도(살짝 위) — 쿼터뷰에서도 눈이 보이게
  const sph = (r, ws, hs) => new THREE.SphereGeometry(r, ws||16, hs||12);

  /* ---- 몸통 (SD 비율: 머리 크게 · 몸 작게) ---- */
  const body = new THREE.Mesh(sph(.37,20,16), mat(col.outfit));
  body.scale.set(1,.92,.86); body.position.y=.52; g.add(body); P.BODY=body;
  const hips = new THREE.Mesh(sph(.31,18,14), mat(col.pants));
  hips.scale.set(1.02,.62,.92); hips.position.y=.27; g.add(hips); P.HIPS=hips;
  if(isEngju && (season==="summer"||col.dress)){ hips.material.color.set(col.outfit); hips.scale.set(1.14,.70,1.02); } // 원피스 치맛단
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.11,.12,.16,10), mat(skin));
  neck.position.y=.80; g.add(neck); P.NECK=neck;
  const collar = new THREE.Mesh(new THREE.TorusGeometry(.17,.045,8,18), mat(col.collar));
  collar.rotation.x=Math.PI/2; collar.position.y=.82; g.add(collar); P.COLLAR=collar;
  if(col.scarf){                                   // 겨울 목도리 (겨울 시즌 의상)
    collar.visible=false;
    const sc=new THREE.Mesh(new THREE.TorusGeometry(.21,.08,10,20), mat(col.scarf));
    sc.rotation.x=Math.PI/2; sc.position.y=.74; g.add(sc); P.SCARF=sc;
    const tail=new THREE.Mesh(new THREE.BoxGeometry(.12,.22,.05), mat(col.scarf));
    tail.position.set(.15,.60,.30); tail.rotation.z=.10; g.add(tail);
  }

  /* ---- 머리 (HEAD 그룹: 고개 숙이기/들기용) ---- */
  const head = new THREE.Group(); head.position.y=1.16; g.add(head); P.HEAD=head;
  head.rotation.x = -g.userData.headBase;
  const R=.50;
  const skull = new THREE.Mesh(sph(R,28,22), mat(skin)); head.add(skull); P.SKULL=skull;
  const irisCol = isEngju ? "#5a3822" : "#2a2019";
  [-1,1].forEach(s=>{
    const side = s<0?"L":"R";
    const ex=.19*s, ey=.00;
    // 눈: 흰자 + 테두리 + 홍채 + 하이라이트 2개 (참고 캐릭터의 큰 눈)
    const white=new THREE.Mesh(sph(.125,14,12), flat("#ffffff"));
    white.scale.set(1,1.30,.36); white.position.set(ex,ey,.435); head.add(white); P["WHITE_"+side]=white;
    const rim=new THREE.Mesh(sph(isEngju?.113:.100,14,12), flat("#1f1a17"));
    rim.scale.set(1,1.25,.40); rim.position.set(ex,ey-.005,.452); head.add(rim); P["EYE_"+side]=rim;
    if(isEngju){
      const iris=new THREE.Mesh(sph(.090,14,12), flat(irisCol));
      iris.scale.set(1,1.2,.42); iris.position.set(ex,ey-.01,.462); head.add(iris); P["IRIS_"+side]=iris;
      const pupil=new THREE.Mesh(sph(.045,10,8), flat("#1f1a17"));
      pupil.scale.set(1,1.2,.5); pupil.position.set(ex,ey-.02,.472); head.add(pupil); P["PUPIL_"+side]=pupil;
      // 속눈썹 (엥주)
      P["LASH_"+side]=[];
      for(let i=0;i<2;i++){
        const lash=new THREE.Mesh(new THREE.BoxGeometry(.035,.012,.012), flat("#1f1a17"));
        lash.position.set(ex+s*(.11+i*.04), ey+.145-i*.045, .455); lash.rotation.z=s*(-.8+i*.3); head.add(lash); P["LASH_"+side].push(lash);
      }
    }
    const hi=new THREE.Mesh(sph(.036,10,8), flat("#ffffff"));
    hi.position.set(ex+.035*s, ey+.055, .49); head.add(hi); P["HI_"+side]=hi;
    const hi2=new THREE.Mesh(sph(.018,8,6), flat("#ffffff"));
    hi2.position.set(ex-.03*s, ey-.05, .49); head.add(hi2); P["HI2_"+side]=hi2;
    // 감은 눈(활짝 웃음용 ∩ 아치)
    const arc=new THREE.Mesh(new THREE.TorusGeometry(isEngju?.105:.095, .022, 8, 16, Math.PI), flat("#1f1a17"));
    arc.position.set(ex, ey-.035, .478); arc.visible=false; head.add(arc); P["EYEARC_"+side]=arc;
    // 눈썹
    const brow=new THREE.Mesh(new THREE.BoxGeometry(.14,.022,.02), flat(isEngju?"#2a2320":"#3a2618"));
    brow.position.set(ex,.19,.44); brow.rotation.z = s*0.10; head.add(brow); P["BROW_"+side]=brow;
    brow.userData.base = s*0.10;
    // 볼터치 — 항상 보이는 분홍 볼
    const blush=new THREE.Mesh(new THREE.CircleGeometry(.085,14),
      flat("#f7a3a0",{transparent:true,opacity:.55,depthWrite:false}));
    blush.position.set(.31*s,-.11,.385); blush.lookAt(.95*s,-.20,2); head.add(blush); P["BLUSH_"+side]=blush;
  });
  const nose=new THREE.Mesh(sph(.024,10,8), flat("#d9957a"));
  nose.position.set(0,-.07,.50); head.add(nose); P.NOSE=nose;
  // 입: 기본 미소(선) / 활짝 웃음(벌린 입) / 놀람(동그란 입) — 표정에 따라 전환
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.06,.014,6,14,Math.PI), flat("#b04b49"));
  mouth.rotation.z=Math.PI; mouth.position.set(0,-.155,.478); head.add(mouth); P.MOUTH=mouth;
  const open=new THREE.Group(); open.position.set(0,-.165,.478); open.visible=false; head.add(open); P.MOUTH_OPEN=open;
  const mo=new THREE.Mesh(new THREE.CircleGeometry(.08,14,Math.PI,Math.PI), flat("#b6403e")); open.add(mo);
  const tongue=new THREE.Mesh(new THREE.CircleGeometry(.045,10,Math.PI,Math.PI), flat("#e8706e")); tongue.position.set(0,-.035,.004); open.add(tongue);
  const teeth=new THREE.Mesh(new THREE.PlaneGeometry(.11,.022), flat("#ffffff")); teeth.position.set(0,-.012,.006); open.add(teeth);
  if(isEngju){ teeth.visible=false; mo.scale.setScalar(.85); tongue.scale.setScalar(.85); }   // 엥주는 더 단순한 벌린 입
  const oh=new THREE.Mesh(new THREE.CircleGeometry(.032,12), flat("#b6403e"));
  oh.position.set(0,-.16,.48); oh.visible=false; head.add(oh); P.MOUTH_O=oh;

  /* ---- 머리카락 — 눈을 가리지 않는 앞머리 ---- */
  const hairG=new THREE.Group(); head.add(hairG); P.HAIR=hairG;
  const hm = ()=>mat(hair);
  const HR=R+.035;
  if(isEngju){
    // 엥주: 검은 머리 · 일자 앞머리(눈 위에서 끝남) · 옆으로 내려온 잔머리 · 정수리 뒤 번헤어
    const back=new THREE.Mesh(new THREE.SphereGeometry(HR,28,20, Math.PI*.90, Math.PI*1.20, 0, Math.PI*.64), hm());
    back.position.y=.02; hairG.add(back);
    const bangs=new THREE.Mesh(new THREE.SphereGeometry(HR,28,14, Math.PI*.10, Math.PI*.80, 0, 1.20), hm());
    bangs.position.y=.02; hairG.add(bangs);
    for(let i=0;i<6;i++){                                            // 앞머리 끝 톱니
      const t=(i-2.5)/2.5, x=t*.36, y=.215-Math.abs(t)*.03;
      const z=Math.sqrt(Math.max(.01, HR*HR - x*x - (y-.02)*(y-.02)))-.02;
      const b=new THREE.Mesh(sph(.075,10,8), hm()); b.scale.set(1,.75,.45); b.position.set(x,y,z); hairG.add(b);
    }
    [-1,1].forEach(s=>{                                              // 귀 앞 잔머리
      const st=new THREE.Mesh(sph(.10,12,10), hm()); st.scale.set(.75,2.2,.7); st.position.set(.49*s,-.12,.14); st.rotation.z=s*.06; hairG.add(st);
    });
    const vol=new THREE.Mesh(sph(.40,20,16), hm()); vol.scale.set(1.2,.95,.8); vol.position.set(0,.03,-.26); hairG.add(vol);
    const bun=new THREE.Mesh(sph(.17,14,12), hm()); bun.position.set(0,.52,-.16); hairG.add(bun);
    const bunTie=new THREE.Mesh(new THREE.TorusGeometry(.10,.03,8,16), mat("#3a3230")); bunTie.rotation.x=Math.PI/2.4; bunTie.position.set(0,.41,-.20); hairG.add(bunTie);
  }else{
    // 도비: 갈색 뭉실 머리 · 앞머리는 이마 왼쪽을 드러내며 오른쪽 아래로 흐름(참고 시트) · 눈은 항상 보임
    const back=new THREE.Mesh(new THREE.SphereGeometry(HR,28,20, Math.PI*.88, Math.PI*1.24, 0, Math.PI*.60), hm());
    back.position.y=.03; hairG.add(back);
    const top=new THREE.Mesh(new THREE.SphereGeometry(HR,28,14, Math.PI*.12, Math.PI*.76, 0, .98), hm());
    top.position.y=.03; hairG.add(top);
    const tips=[[-.36,.34,-.55],[-.20,.30,-.45],[-.03,.26,-.35],[.14,.22,-.25],[.29,.18,-.15]];
    tips.forEach(([x,y,rz])=>{
      const z=Math.sqrt(Math.max(.01, HR*HR - x*x - (y-.03)*(y-.03)))-.01;
      const b=new THREE.Mesh(sph(.10,12,10), hm()); b.scale.set(.85,1.55,.5); b.position.set(x,y,z); b.rotation.z=rz; hairG.add(b);
    });
    [-1,1].forEach(s=>{ const v=new THREE.Mesh(sph(.17,14,10), hm()); v.scale.set(.8,1.05,.9); v.position.set(.44*s,.10,.02); hairG.add(v); });
    const puff=new THREE.Mesh(sph(.24,14,10), hm()); puff.scale.set(1.35,.65,1.1); puff.position.set(0,.47,-.05); hairG.add(puff);
    const vol=new THREE.Mesh(sph(.38,20,16), hm()); vol.scale.set(1.15,.95,.8); vol.position.set(0,.05,-.24); hairG.add(vol);
  }

  /* ---- 팔 (어깨 피벗) + 손 ---- */
  [-1,1].forEach(s=>{
    const side = s<0?"L":"R";
    const arm=new THREE.Group(); arm.position.set(.37*s,.68,0); g.add(arm); P["ARM_"+side]=arm;
    const sleeve=new THREE.Mesh(sph(.11,12,10), mat(col.sleeve));
    sleeve.scale.set(1,1.5,1); sleeve.position.set(.03*s,-.15,0); arm.add(sleeve);
    const hand=new THREE.Mesh(sph(.085,12,10), mat(skin));
    hand.position.set(.045*s,-.34,.02); arm.add(hand); P["HAND_"+side]=hand;
  });
  /* ---- 다리 (엉덩이 피벗) + 신발 ---- */
  [-1,1].forEach(s=>{
    const side = s<0?"L":"R";
    const leg=new THREE.Group(); leg.position.set(.15*s,.26,0); g.add(leg); P["LEG_"+side]=leg;
    const thigh=new THREE.Mesh(sph(.105,12,10), mat(col.pants));
    thigh.scale.set(1,1.3,1); thigh.position.set(0,-.09,0); leg.add(thigh);
    const shoe=new THREE.Mesh(sph(.11,12,10), mat(col.shoes));
    shoe.scale.set(1,.55,1.45); shoe.position.set(0,-.21,.05); leg.add(shoe); P["SHOE_"+side]=shoe;
  });
  g.traverse(m=>{ if(m.isMesh) m.castShadow=true; });
  setExpression(g, opt.expression||"normal");
  return g;
}
/* 기존 호출 호환: makeChar({skin,hair,outfit,isEngju, season?}) */
function makeChar(opt){ return makeCharV2(opt); }

/* ---- 표정: 눈(뜸/감음/커짐) · 눈썹 · 입(미소/벌림/동그라미) · 볼터치
   normal | blush(부끄러움) | happy(활짝 웃음) | grin(웃음, 눈 뜸) | surprised(놀람) | nervous | sad(눈물·풀죽음) ---- */
function setExpression(ch, name){
  const P = ch && ch.userData && ch.userData.parts; if(!P || !P.MOUTH) return;
  ch.userData.expression = name;
  const eyes = (open, scale) => ["L","R"].forEach(s=>{
    const show = m=>{ if(m) m.visible=open; };
    show(P["WHITE_"+s]); show(P["EYE_"+s]); show(P["IRIS_"+s]); show(P["PUPIL_"+s]); show(P["HI_"+s]); show(P["HI2_"+s]);
    (P["LASH_"+s]||[]).forEach(show);
    if(P["EYEARC_"+s]) P["EYEARC_"+s].visible=!open;
    if(P["EYE_"+s]){ P["EYE_"+s].scale.set(scale,1.25*scale,.40); }
    if(P["IRIS_"+s]) P["IRIS_"+s].scale.set(scale,1.2*scale,.42);
  });
  const mouth = (kind, sc) => {
    P.MOUTH.visible = kind==="smile"; if(P.MOUTH_OPEN) P.MOUTH_OPEN.visible = kind==="open"; if(P.MOUTH_O) P.MOUTH_O.visible = kind==="o";
    P.MOUTH.scale.set(sc||1, sc||1, 1); if(P.MOUTH_OPEN) P.MOUTH_OPEN.scale.setScalar(sc||1);
  };
  const blush = (op, sc) => ["BLUSH_L","BLUSH_R"].forEach(k=>{ P[k].material.opacity=op; P[k].scale.setScalar(sc); });
  const brows = (l, r, y) => { P.BROW_L.rotation.z = P.BROW_L.userData.base + l; P.BROW_R.rotation.z = P.BROW_R.userData.base + r;
    P.BROW_L.position.y = P.BROW_R.position.y = .19 + (y||0); };
  const engju = ch.userData.role==="engju";            // 엥주는 웃을 때 항상 ∩ 눈웃음 (눈동자를 남기지 않음)
  if(name==="blush"){        eyes(!engju,1.0); mouth("smile",1.05); blush(.9,1.4);  brows(.18,-.18,.01); }
  else if(name==="happy"){   eyes(false,1.0); mouth("open",1.0);   blush(.75,1.25); brows(.25,-.25,.03); }
  else if(name==="grin"){    eyes(!engju,1.0); mouth("open",.9);   blush(.70,1.15); brows(.2,-.2,.02); }
  else if(name==="cry"){     eyes(false,1.0); mouth("open",.8);    blush(.85,1.3);  brows(-.35,.35,.03); }
  else if(name==="surprised"){ eyes(true,1.18); mouth("o",1.0);    blush(.60,1.1);  brows(.05,-.05,.06); }
  else if(name==="nervous"){ eyes(true,1.0);  mouth("smile",.6);   blush(.80,1.2);  brows(-.30,.30,.02); }
  else if(name==="sad"){     eyes(true,.95);  mouth("smile",.5);   blush(.45,1.0);  brows(-.35,.35,.03); P.MOUTH.rotation.z=0; }
  else{                      eyes(true,1.0);  mouth("smile",1.0);  blush(.55,1.0);  brows(0,0,0); }
  if(name!=="sad") P.MOUTH.rotation.z=Math.PI;
}
/* ---- 앉기: 몸통을 낮추고 다리를 앞으로 (전체를 위로 올리지 않음) ---- */
function setSit(ch, on){
  const P = ch && ch.userData && ch.userData.parts; if(!P || !P.LEG_L) return;
  ch.userData.sitting = !!on;
  const k = on ? 1 : 0;
  ["LEG_L","LEG_R"].forEach(n=>{ P[n].rotation.x = -1.35*k; });
  ["ARM_L","ARM_R"].forEach(n=>{ P[n].rotation.x = -.35*k; });
  P.BODY.position.y = .52 - .06*k; P.HIPS.position.y = .27 - .04*k;
  P.NECK.position.y = .80 - .06*k; P.COLLAR.position.y = .82 - .06*k; if(P.SCARF) P.SCARF.position.y = .80 - .06*k;
  P.HEAD.position.y = 1.16 - .06*k;
}
/* ---- 고개 들기(위 +)/숙이기(아래 -) — 기본 각도(headBase) 위에 더함 ---- */
function setHeadTilt(ch, rad){
  const P = ch && ch.userData && ch.userData.parts; if(!P || !P.HEAD) return;
  P.HEAD.rotation.x = -(rad + (ch.userData.headBase||0));
}
/* ---- 고개 돌리기(좌우, 몸은 그대로) — 대화 장면에서 카메라 쪽으로 얼굴을 보여줄 때 ---- */
function setHeadYaw(ch, rad){
  const P = ch && ch.userData && ch.userData.parts; if(!P || !P.HEAD) return;
  P.HEAD.rotation.y = rad;
}
/* ---- 걷기 프레임: 팔·다리 교차 스윙 (k: 0~1 진행, cycles: 걸음 수) ---- */
function walkPose(ch, k, cycles){
  const P = ch && ch.userData && ch.userData.parts; if(!P || !P.LEG_L) return;
  if(ch.userData.sitting) return;
  const a = Math.sin(k*Math.PI*2*(cycles||3));
  P.ARM_L.rotation.x =  .55*a; P.ARM_R.rotation.x = -.55*a;
  P.LEG_L.rotation.x = -.45*a; P.LEG_R.rotation.x =  .45*a;
}
function restPose(ch){
  const P = ch && ch.userData && ch.userData.parts; if(!P || !P.LEG_L) return;
  if(ch.userData.sitting){ setSit(ch, true); return; }
  ["ARM_L","ARM_R","LEG_L","LEG_R"].forEach(n=>{ P[n].rotation.x=0; });
}

/* ---------------- 공용 소품 빌더 ---------------- */
const toon = c => new THREE.MeshToonMaterial({color:c});
function ground(r, color){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.3,36), toon(color));
  m.position.y=-.15; m.receiveShadow=true; return m;
}
function warmLights(){
  scene.add(new THREE.HemisphereLight(0xfff2dd, 0x5a4632, .85));
  const p=new THREE.PointLight(0xffb066, 1.1, 30);   // 오렌지 전구색 (GDD 2.1)
  p.position.set(3,6,3); p.castShadow=true;
  p.shadow.mapSize.set(1024,1024);
  scene.add(p);

}

const interactives = {};   // name → mesh
let charDobby=null, charEngju=null;
let sceneGen=0;
function clearScene(){

  while(scene.children.length) scene.remove(scene.children[0]);

}

/* ■ Round 1 : 문래 아카이테판 — 실제 매장(akai teppan)을 동숲풍으로 재해석

function gradientTex(top, bottom){
  const c=document.createElement("canvas"); c.width=4; c.height=128;
  const g=c.getContext("2d"); const gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,top); gr.addColorStop(1,bottom);
  g.fillStyle=gr; g.fillRect(0,0,4,128);
  return new THREE.CanvasTexture(c);
}

    for(let x=0;x<=2048;x+=64) g.lineTo(x, 560+Math.sin(x*.004)*40+Math.sin(x*.013)*18);

    const layers=[{y:600,h:[40,120],w:[40,90],c:"#6b5a86",win:.25},{y:660,h:[60,190],w:[50,110],c:"#4b4270",win:.4},
                  {y:740,h:[40,120],w:[30,70],c:"#3a3358",win:.5},{y:820,h:[30,90],w:[26,56],c:"#2d2846",win:.55}];

/* ---------------- 3D 모델 슬롯 (GLB) ----------------
   업로드/파일이 있으면 캐릭터·배경을 자동 교체합니다. 없으면 기본 도형 유지. */
const modelCache = {};
function loadModel(file){
  if(!file || !window.THREE || !THREE.GLTFLoader) return Promise.resolve(null);
  if(modelCache[file]) return modelCache[file];
  modelCache[file] = new Promise(res=>{
    try{
      new THREE.GLTFLoader().load(url(file), g=>res(g.scene||null), undefined, ()=>res(null));
    }catch(e){ res(null); }
  });
  return modelCache[file];
}
// 크기·위치 정규화: targetH(높이 맞춤) 또는 targetW(가로폭 맞춤), 바닥을 y=0에
function normalizeModel(obj, targetH, targetW){
  const box=new THREE.Box3().setFromObject(obj);
  const size=box.getSize(new THREE.Vector3());
  let s=1;
  if(targetH && size.y>0) s = targetH/size.y;
  else if(targetW){ const w=Math.max(size.x,size.z)||1; s = targetW/w; }
  obj.scale.setScalar(s);
  const box2=new THREE.Box3().setFromObject(obj);
  const c=box2.getCenter(new THREE.Vector3());
  obj.position.x -= c.x;
  obj.position.z -= c.z;
  obj.position.y -= box2.min.y;
  obj.traverse(m=>{ if(m.isMesh){ m.castShadow=true; m.receiveShadow=true; } });
  return obj;
}
// 캐릭터 교체: 이동/회전 로직이 걸린 그룹은 유지하고 내용물만 모델로
function dressChar(group, file, height){
  const gen=sceneGen;
  loadModel(file).then(model=>{
    if(!model || gen!==sceneGen || !group.parent) return;
    while(group.children.length) group.remove(group.children[0]);
    group.add(normalizeModel(model.clone(true), height));
  });
}
// 배경 교체: 장식(벽·바닥·소품)은 숨기고, 클릭 대상·캐릭터·하늘·조명·파티클은 유지
function hideDecor(){
  const keep=new Set(Object.values(interactives));
  if(charDobby) keep.add(charDobby);
  if(charEngju) keep.add(charEngju);
  scene.children.forEach(o=>{
    if(o.isLight || o.isPoints || o.isSprite || o.isLine || o.name==="SKY") return;
    if(keep.has(o)) return;
    o.visible=false;
  });
}
function applyCustomModels(bgKey){
  const mf = CFG.models || {};
  if(charDobby && mf.dobby) dressChar(charDobby, mf.dobby, 1.7);
  if(charEngju && mf.engju) dressChar(charEngju, mf.engju, 1.65);
  const envFile = mf[bgKey];
  if(!envFile) return;
  const gen=sceneGen;
  loadModel(envFile).then(model=>{
    if(!model || gen!==sceneGen) return;
    hideDecor();
    scene.add(normalizeModel(model.clone(true), null, 9));
  });
}

const dlgBox=$("dialogue-box"), dlgText=$("dlg-text"), dlgNext=$("dlg-next"), spkPlate=$("speaker-plate");
let dlgResolver=null, typingTimer=null, typingFull="", typingDone=false;
function fmtLine(line){
  // (지문) 부분을 옅은 색으로
  return line.replace(/\(([^)]*)\)/g, '<span class="direction">($1)</span>');
}
function showLine(speaker, line){
  return new Promise(res=>{
    dlgBox.classList.remove("hidden");
    spkPlate.textContent = speaker;
    spkPlate.className = "speaker-plate" + (speaker==="엥주"?" engju":((speaker==="SYSTEM"||speaker==="나레이션")?" system":""));
    dlgNext.style.visibility="hidden";
    typingFull = line; typingDone=false;
    let i=0; dlgText.innerHTML="";
    clearInterval(typingTimer);
    typingTimer=setInterval(()=>{
      i++;
      dlgText.innerHTML = fmtLine(line.slice(0,i));
      if(line[i-1] && line[i-1]!==" ") sfx("typing");
      if(i>=line.length){ clearInterval(typingTimer); typingDone=true; dlgNext.style.visibility="visible"; }
    }, 38);
    dlgResolver = res;
  });
}
dlgBox.addEventListener("pointerup", e=>{
  e.stopPropagation();
  if(!typingDone){
    clearInterval(typingTimer);
    dlgText.innerHTML = fmtLine(typingFull);
    typingDone=true; dlgNext.style.visibility="visible";
    return;
  }
  if(dlgResolver){ const r=dlgResolver; dlgResolver=null; sfx("click"); r(); }
});
async function playDialogue(lines){
  // 대사가 시작되면 음악을 짧게 낮추고, 대사가 끝나면 원래 장면 볼륨으로 복귀
  await duckBGM(.60, 260);

      if(l.fx && ACTIONS[l.fx]) await ACTIONS[l.fx](l);          // 대사 직전 연출 (카메라·표정)
      await showLine(l.speaker, l.line);

    await restoreBGM(420);
  }
}

  trunk.position.y=1.3; trunk.castShadow=true; tree.add(trunk);

  [[0,3.2,0,1.5],[-1.05,2.7,.25,1.0],[1.05,2.8,-.2,1.05],[0,2.6,.95,.9]].forEach(([x,y,z,r])=>{

    f.position.set(x,y,z); f.castShadow=true; tree.add(f);
  });
  // 나무 조명 (열매를 볼 때마다 조금씩 켜지고, 마지막에 전부 켜짐)
  const lights=[]; const N=visit===1?28:44;
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2*2.3, r=1.15+Math.sin(i*1.7)*.45, y=2.15+Math.sin(i*.9)*.7+((i%3)*.25);
    const b=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6), new THREE.MeshBasicMaterial({color:[0xfff1b8,0xffd0a0,0xffe9d0][i%3], transparent:true, opacity:.12}));

    const fl=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6), toon([0xf6a6a0,0xfff1b8,0xffffff,0xc9b8ff][i%4]));
    fl.position.set(Math.cos(a)*r,.08,Math.sin(a)*r); scene.add(fl);

    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2+.4;
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1.1,6), toon(0x6e4a2e)); post.position.set(Math.cos(a)*3.4,.55,Math.sin(a)*3.4); scene.add(post);
      const lan=new THREE.Mesh(new THREE.SphereGeometry(.11,8,6), new THREE.MeshBasicMaterial({color:0xffe9b8})); lan.position.set(Math.cos(a)*3.4,1.15,Math.sin(a)*3.4); scene.add(lan);
      const pl=new THREE.PointLight(0xffd9a0,.35,5); pl.position.copy(lan.position); scene.add(pl);
    }
    // 전에 매달아 둔 폴라로이드 몇 장 (시간이 쌓인 흔적)
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2+1.1;
      const card=new THREE.Mesh(new THREE.PlaneGeometry(.26,.32), new THREE.MeshBasicMaterial({color:0xfffaf0, side:THREE.DoubleSide}));
      card.position.set(Math.cos(a)*1.25, 2.05+(i%2)*.4, Math.sin(a)*1.05); card.lookAt(Math.cos(a)*5, card.position.y, Math.sin(a)*5); tree.add(card);
    }
    // 작은 벤치
    const bench=new THREE.Mesh(new THREE.BoxGeometry(1.3,.06,.36), toon(0x9a6b44)); bench.position.set(-2.6,.42,-1.6); bench.rotation.y=.5; scene.add(bench);
  }
  /* 나무를 바라보는 두 사람 (계절 중립 파스텔) */
  charDobby = makeCharV2({role:"dobby", season:"neutral"});
  charDobby.position.set(-2.0,0,2.0); faceTo(charDobby,0,0); charDobby.scale.setScalar(.8);
  charEngju = makeCharV2({role:"engju", season:"neutral"});
  charEngju.position.set(2.0,0,2.1); faceTo(charEngju,0,0); charEngju.scale.setScalar(.8);
  scene.add(charDobby,charEngju);
  interactives.CHAR_DOBBY = charDobby; interactives.CHAR_ENGJU = charEngju;
  // 기본 구도: 나무 전체 + 떨어진 열매가 한 화면에 (비스듬히 내려다봄)
  orbit.theta=Math.PI/5; orbit.phi=Math.PI/3.2; orbit.radius=9.4; orbit.target.set(0,1.6,.4);
  return tree;
}
/* 나무 조명 비율(0~1)만큼 켜기 */
function lightTree(tree, ratio, ms){
  const ls=tree.userData.lights, from=tree.userData.lit, to=Math.max(from, ratio);
  tree.userData.lit=to;
  return tweenP(ms||900, k=>{
    const cur=from+(to-from)*k;
    ls.forEach((b,i)=>{ const on=(i/ls.length)<cur; b.material.opacity = on ? 1 : .12; b.scale.setScalar(on?1.35:1); });
    tree.userData.glow.intensity = cur*1.2;
  });
}
/* ---- 동물의 숲 과일 6종 (로우폴리) ---- */
function makeFruit(type){
  const g=new THREE.Group();
  const add=(mesh)=>{ g.add(mesh); return mesh; };
  const stem=()=>{ const st=new THREE.Mesh(new THREE.CylinderGeometry(.015,.02,.09,6), toon(0x6e4a2e)); st.position.y=.17; g.add(st); };
  const leaf=()=>{ const lf=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6), toon(0x63a862)); lf.scale.set(1.6,.5,.8); lf.position.set(.05,.19,0); g.add(lf); };
  if(type==="apple"){ add(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10), toon(0xe0453a))); stem(); leaf(); }
  else if(type==="orange"){ const o=add(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10), toon(0xf59a23))); o.scale.y=.92; stem(); }
  else if(type==="peach"){ add(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10), toon(0xf7b2c1))); stem(); leaf(); }
  else if(type==="pear"){ const b=add(new THREE.Mesh(new THREE.SphereGeometry(.14,12,10), toon(0xc9d24b))); b.scale.y=1.15; b.position.y=-.02;
    const t=add(new THREE.Mesh(new THREE.SphereGeometry(.09,10,8), toon(0xc9d24b))); t.position.y=.12; stem(); }
  else if(type==="cherry"){ const c1=add(new THREE.Mesh(new THREE.SphereGeometry(.1,10,8), toon(0xc22b3f))); c1.position.set(-.07,0,0);
    const c2=add(new THREE.Mesh(new THREE.SphereGeometry(.1,10,8), toon(0xc22b3f))); c2.position.set(.08,-.02,0);
    const s1=add(new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.16,6), toon(0x6e4a2e))); s1.position.set(-.04,.12,0); s1.rotation.z=.25;
    const s2=add(new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.16,6), toon(0x6e4a2e))); s2.position.set(.05,.11,0); s2.rotation.z=-.2; leaf(); }
  else { // coconut — 특별한 추억(여행) 전용
    const c=add(new THREE.Mesh(new THREE.SphereGeometry(.16,12,10), toon(0x8a6a44))); c.scale.y=1.1;
    for(let i=0;i<3;i++){ const d=add(new THREE.Mesh(new THREE.CircleGeometry(.025,8), new THREE.MeshBasicMaterial({color:0x4a3520})));
      d.position.set(-.04+i*.045,.1,.14); d.lookAt(d.position.x*3,1,2); } }
  g.traverse(m=>{ if(m.isMesh) m.castShadow=true; });
  g.scale.setScalar(1.25);   // 열매가 4~5개뿐이라 조금 크게
  return g;
}

/* ---- 사진 묶음 UI: 대표사진 크게 + 주변 폴라로이드, 개별 클릭 → 크게 보기 ---- */
function showBundle(group, gi){
  return new Promise(async res=>{
    const ov=$("bundle"), board=$("bd-board"), title=$("bd-title"), closing=$("bd-closing"), btn=$("btn-bd-done"), tip=$("bd-tip");
    board.innerHTML=""; closing.textContent=""; closing.classList.remove("show");
    btn.style.visibility="hidden"; tip.style.visibility="hidden";
    title.textContent = group.title||"";
    const photos=await expandPhotos((group.photos||[]).map(p=>({file:p.photo, label:p.date, caption:p.caption, hold:p.hold})));
    photos.forEach(p=>{ if(p.extraOf) p.hold=false; });
    const heroIdx = Math.max(0, photos.findIndex(p=>p.hold));
    const viewer = photoViewer(photos, {captions:true});
    // 배치: 대표 1장(중앙 큼) + 나머지 작은 폴라로이드 (최대 6장)
    const slots=[[13,20,-7],[87,22,6],[12,80,5],[88,80,-6],[50,12,3],[50,86,-4]];
    const cells=[];
    photos.forEach((ph,i)=>{
      const cell=document.createElement("div");
      const isHero = i===heroIdx;
      cell.className="bd-photo"+(isHero?" hero":"");
      if(!isHero){ const s=slots[cells.filter(c=>!c.hero).length % slots.length]; cell.style.left=s[0]+"%"; cell.style.top=s[1]+"%"; cell.style.setProperty("--rot", s[2]+"deg"); }
      else cell.style.setProperty("--rot","-2deg");
      photoElement(ph.file, ph.label, el=>{ cell.appendChild(el); const cap=document.createElement("div"); cap.className="cap"; cap.textContent=ph.label; cell.appendChild(cap); });
      cell.addEventListener("pointerup", e=>{ e.stopPropagation(); sfx("click"); viewer.open(i); });
      board.appendChild(cell); cells.push({el:cell, hero:isHero, i});
      album.push({file:ph.file, label:ph.label});
    });
    ov.classList.remove("hidden");
    // 분위기별 등장 연출
    const mood=group.mood||"warm";
    const order = [cells.find(c=>c.hero)].concat(cells.filter(c=>!c.hero));
    const gap = mood==="fast" ? 170 : mood==="soft" ? 620 : mood==="calm" ? 720 : 380;
    for(const c of order){
      if(!c) continue;
      c.el.classList.add(mood==="soft"||mood==="calm" ? "in-soft" : "in");
      sfx(mood==="fast" ? "shutter" : "click");
      await wait(gap);
    }
    await wait(mood==="calm" ? 700 : 300);
    // 마지막 문장 (타이핑)
    const text=group.closing||"";
    closing.classList.add("show");
    for(let i=1;i<=text.length;i++){ closing.textContent=text.slice(0,i); if(text[i-1]!==" ") sfx("typing"); await wait(34); }
    tip.style.visibility="visible"; btn.style.visibility="visible";
    btn.onclick = ()=>{ sfx("click"); viewer.close(); ov.classList.add("hidden"); res(); };
  });
}
/* ---- 공용 확대 뷰어 (사진 묶음 · 하트 콜라주에서 재사용) ---- */
function photoViewer(files, opt){
  opt=opt||{};
  const vw=$("hc-viewer"), vwPhoto=$("hcv-photo"), vwCount=$("hcv-count");
  const N=files.length; let cur=0, renderId=0;
  function render(){
    const ph=files[cur]; vwPhoto.innerHTML="";
    const myId=++renderId;                                   // 빠르게 넘길 때 늦게 도착한 이전 사진이 겹쳐 쌓이지 않도록
    photoElement(ph.file, ph.label, el=>{
      if(myId!==renderId) return;
      vwPhoto.appendChild(el);
      const cap=document.createElement("div"); cap.className="hcv-cap";
      cap.textContent=ph.label||"";
      if(opt.captions && ph.caption){ const c2=document.createElement("div"); c2.className="hcv-cap2"; c2.textContent=ph.caption; cap.appendChild(c2); }
      vwPhoto.appendChild(cap);
    });
    vwCount.textContent=(cur+1)+" / "+N;
  }
  function open(i){ cur=i||0; render(); vw.classList.remove("hidden"); }
  function close(){ vw.classList.add("hidden"); }
  function go(d){ sfx("click"); cur=(cur+d+N)%N; render(); }
  $("hcv-prev").onclick = e=>{ e.stopPropagation(); go(-1); };
  $("hcv-next").onclick = e=>{ e.stopPropagation(); go(1); };
  let sx=null;
  vw.onpointerdown = e=>{ sx=e.clientX; };
  vw.onpointerup = e=>{
    if(sx===null) return;
    const dx=e.clientX-sx; sx=null;
    if(Math.abs(dx)>48){ go(dx<0?1:-1); return; }
    if(e.target===vw){ sfx("click"); close(); }
  };
  return {open, close};
}

        d.f.position.z = d.from.z+(d.to.z-d.from.z)*k;

                     tx:f.position.x*.7, ty:.5, tz:f.position.z*.55+.2 }, 1300);
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false, opacity:.9}));
    glow.position.copy(f.position); glow.position.y+=.15; scene.add(glow);
    let pt=0;
    const pulse=setInterval(()=>{ pt+=.12; glow.scale.setScalar(.9+Math.sin(pt*3)*.25); glow.material.opacity=.6+Math.sin(pt*3)*.3; f.position.y = .18 + Math.abs(Math.sin(pt*2))*.12; }, 33);

    clearInterval(pulse); scene.remove(glow); delete interactives.OBJ_FRUIT;

    const fp=f.position.clone();

  }
  hint(null);
  await camTween(treeCam, 1400);                          // 마지막 열매까지 끝나면 나무 전체 구도로 풀백

    await wait(400);
  }else{
    // 카드 → 빛의 길이 탄중아루 방향으로 이어지고 카메라가 따라감
    if(outro.card) await showIntro(outro.card, 2600);

    const last=pathPts[pathPts.length-1].position;

function buildStarfall(){
  clearScene();
  const sky=new THREE.Mesh(new THREE.SphereGeometry(46,24,16),
    new THREE.MeshBasicMaterial({map:gradientTex("#070a1e","#2a2350"), side:THREE.BackSide}));

  const n=420, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-.5)*80; pos[i*3+1]=1.5+Math.random()*16; pos[i*3+2]=-14-Math.random()*26; }
  const st=new THREE.Points(new THREE.BufferGeometry().setAttribute("position",new THREE.BufferAttribute(pos,3)),
    new THREE.PointsMaterial({map:TEX_SNOW,size:.22,transparent:true,opacity:.9,depthWrite:false}));
  scene.add(st);
  const moon=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,12), new THREE.MeshBasicMaterial({color:0xfff2c8}));
  moon.position.set(-8,8.5,-30); scene.add(moon);
  const moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false, opacity:.55})); moonGlow.scale.setScalar(7); moonGlow.position.copy(moon.position); scene.add(moonGlow);
  scene.add(new THREE.HemisphereLight(0x8090c0, 0x141826, .6));
  const p=new THREE.PointLight(0xaac0ff,.55,30); p.position.set(0,8,6); scene.add(p);
  const rim=new THREE.DirectionalLight(0x9fb4ff,.35); rim.position.set(0,4,-10); scene.add(rim);   // 뒷모습 실루엣이 살아나도록 하늘 쪽에서 오는 빛
  scene.add(ground(9, 0x1c2438));
  // 언덕 풀·돌
  for(let i=0;i<24;i++){ const a=i*2.399, r=1.5+(i%6)*.9; const t=new THREE.Mesh(new THREE.SphereGeometry(.07,6,5), toon(0x2a3a50)); t.position.set(Math.cos(a)*r,.05,Math.sin(a)*r); scene.add(t); }

  scene.add(charDobby,charEngju);

  // 카메라: 두 사람 뒤, 낮은 높이에서 위쪽 하늘을 함께 봄 → 화면 아래 ~27%에 두 사람, 위 ~73%는 밤하늘
  orbitLookFrom(new THREE.Vector3(0,1.6,6.5), new THREE.Vector3(0,2.4,-8.0));
}

  stopBGM(650);

  await showIntro(sf.card||{date:"─ 밤하늘 ─", location: sf.title||"별똥별에 비추는 도비의 약속"});
  const wishes = sf.wishes||[];
  let got=0, active=false, starBgmStarted=false;
  const wishEl=$("wish");
  const updateHint=()=>hint(`✨ 반짝이는 곳을 주목! 별똥별이 지나갈 때 탭 ( ${got} / ${wishes.length} )`);
  updateHint();
  minigameTap = ()=>{
    if(!active){ tone(220,.08,"sine",.03); return; }
    active=false; got++;
    // 소원이 하나씩 쌓일수록 아주 조금씩 음악도 따뜻하게 올라감
    if(starBgmStarted){
      const startV=sf.bgmStartVolume!=null?sf.bgmStartVolume:.10;
      const peakV=sf.bgmPeakVolume!=null?sf.bgmPeakVolume:.22;
      const v=startV + (peakV-startV)*(got/Math.max(1,wishes.length));
      setBGMVolume(v, 650, true);
    }
    tone(880,.5,"sine",.06,1760);
    wishEl.textContent = "★ " + wishes[got-1];
    wishEl.classList.add("show");
    setTimeout(()=>wishEl.classList.remove("show"), 3400);
    updateHint();
    // 성공: 한 사람이 살짝 상대 쪽으로 기울고 둘 사이에 작은 하트
    const lean = got%2 ? charEngju : charDobby, dir = got%2 ? 1 : -1;
    tweenP(900, k=>{ lean.rotation.z = Math.sin(k*Math.PI)*.16*dir; });
    burst(new THREE.Vector3(0,1.15,.6), TEX_HEART, 3, .5, 1.3);
  };
  // 화면 기준 좌표(nx,ny: -1~1)를 하늘 위 월드 좌표로 변환 (항상 하늘 영역에 등장)
  const skyPoint=(nx,ny)=>{
    const v=new THREE.Vector3(nx,ny,.5).unproject(camera);
    const dir=v.sub(camera.position).normalize();
    return camera.position.clone().addScaledVector(dir, 30);
  };
  while(got < wishes.length){
    await wait(1100 + Math.random()*1300);
    const nx=-.3+Math.random()*.6, ny=.45+Math.random()*.35;
    const from=skyPoint(nx, ny);
    const to=skyPoint(nx-.5, ny-.42);
    // ── 예고: 반짝임이 커짐 (0.9초) ──
    const cue=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false}));
    cue.position.copy(from); cue.scale.setScalar(.1); scene.add(cue);
    tone(1560,.18,"sine",.045);
    await tweenP(900, k=>{
      cue.scale.setScalar(.2 + Math.sin(k*Math.PI*3)*.5 + k*1.4);
      cue.material.opacity = .5 + Math.sin(k*Math.PI*6)*.5;
    }, t=>t);
    scene.remove(cue);
    // ── 별똥별 낙하 (1.65초) — 첫 별이 실제로 움직이는 순간 BGM 첫 음 ──
    if(!starBgmStarted){
      starBgmStarted=true;
      playBGM(sf.bgm, {volume:sf.bgmStartVolume!=null?sf.bgmStartVolume:.10, fadeMs:900, crossfadeMs:500});
    }
    tone(1320,.35,"sine",.05,1980);
    const head=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false}));
    head.scale.setScalar(2.6); head.position.copy(from); scene.add(head);
    const dir=to.clone().sub(from).normalize();
    const tail=[];
    for(let t=0;t<7;t++){
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false}));
      sp.scale.setScalar(1.9 - t*0.22); sp.material.opacity = .8 - t*.1;
      sp.position.copy(from); scene.add(sp); tail.push(sp);
    }
    active=true;
    await tweenP(1650, k=>{
      head.position.lerpVectors(from,to,k);
      tail.forEach((sp,t)=>{ sp.position.copy(head.position).addScaledVector(dir, -(t+1)*0.85); });
      if(k>.78){ const f=1-(k-.78)/.22; head.material.opacity=f; tail.forEach((sp,t)=>{ sp.material.opacity=(.8-t*.1)*f; }); }
    }, t=>t);
    active=false;
    scene.remove(head); tail.forEach(sp=>scene.remove(sp));
  }
  minigameTap=null;
  hint(null);
  burst(new THREE.Vector3(0,1.6,.6), TEX_HEART, 12, 1.2, 2);
  await wait(1400);
}

/* ---------------- 유리병 편지 (해변 에필로그 나레이션) ---------------- */
async function runBottleLetter(epi){
  const glass=()=>new THREE.MeshToonMaterial({color:0xbfe8e0, transparent:true, opacity:.75});
  const bottle=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.5,10), glass());
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.055,.08,.16,8), glass()); neck.position.y=.33;
  const cork=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.09,8), toon(0xb08a5a)); cork.position.y=.44;
  const paper=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.3,8), toon(0xfff8e8));
  bottle.add(body,neck,cork,paper);
  bottle.rotation.z=Math.PI/2.3;
  const from=new THREE.Vector3(2.3,.1,-4.6), to=new THREE.Vector3(2.5,.14,-2.3);
  bottle.position.copy(from);
  scene.add(bottle);
  interactives.OBJ_BOTTLE = bottle;
  burst(from, dotTexture("#cfe8ff"), 6, 1, .8);
  // ① 병이 파도에 실려 천천히 떠밀려 옴 (넉넉한 표류 시간)
  const drift = tweenP(3400, k=>{
    bottle.position.lerpVectors(from,to,k);
    bottle.position.y = .1 + Math.sin(k*Math.PI*5)*.06;
    bottle.rotation.x = Math.sin(k*Math.PI*3.2)*.25;
  });
  // ② 표류하는 동안 카메라가 병 쪽으로 천천히 다가감 (줌인)
  const cam0={tx:orbit.target.x, ty:orbit.target.y, tz:orbit.target.z, r:orbit.radius, th:orbit.theta};
  const camZoom = tweenP(3400, k=>{
    orbit.target.x = cam0.tx + (to.x-0.4 - cam0.tx)*k;
    orbit.target.y = cam0.ty + (0.5 - cam0.ty)*k;
    orbit.target.z = cam0.tz + (to.z+0.4 - cam0.tz)*k;
    orbit.radius   = cam0.r  + (6.0 - cam0.r)*k;
    orbit.theta    = cam0.th + (Math.PI*.28 - cam0.th)*k;
  });
  await Promise.all([drift, camZoom]);
  // ③ 병이 모래에 닿아 잠시 멈추는 박자 — 잔파도 반짝임과 함께
  burst(to.clone().add(new THREE.Vector3(0,.15,0)), dotTexture("#cfe8ff"), 5, .8, .9);
  await wait(450);
  await waitForTap("OBJ_BOTTLE", "파도에 떠밀려 온 유리병... 눌러서 열어보세요!", bottle, 1.0);
  sfx("click");
  await tweenP(420, k=>{ cork.position.y=.44+k*.9; cork.position.x=k*.35; cork.rotation.z=k*2; });
  burst(bottle.position.clone().add(new THREE.Vector3(0,.4,0)), TEX_SPARK, 8, 1.2, 1);
  await playDialogue((epi.narration||[]).map(t=>({speaker:"나레이션", line:t})));
  scene.remove(bottle);
}

/* ---------------- 엔딩 크레딧 (사이사이에 게임에서 본 사진들) ---------------- */
function runCredits(lines){
  return new Promise(res=>{
    const ov=$("credits"), col=$("credits-col");
    col.innerHTML="";
    // 지금까지 게임에서 사용된 사진들 (중복 제거)
    const seen={}, photos=[];
    album.forEach(p=>{ if(p.file && !seen[p.file]){ seen[p.file]=1; photos.push(p); } });
    const step = Math.max(1, Math.floor(photos.length/ Math.max(1,(lines||[]).length-1)));
    let pi=0;
    (lines||[]).forEach((t,i)=>{
      const d=document.createElement("div"); d.className="cr-line"; d.textContent=t;
      if(t.indexOf("예식일")===0) d.classList.add("wedding");
      if(t.indexOf("…그리고")===0 || i===(lines.length-1)) d.classList.add("end");
      col.appendChild(d);
      if(i<lines.length-1){
        const w=document.createElement("div"); w.className="cr-photos";
        for(let k=0;k<Math.min(2,step) && pi<photos.length; k++, pi++){
          const ph=document.createElement("div"); ph.className="cr-photo";
          photoElement(photos[pi].file, photos[pi].label, el=>ph.appendChild(el)); w.appendChild(ph);
        }
        if(w.children.length) col.appendChild(w);
      }
    });
    ov.classList.remove("hidden");
    let skip=false;
    ov.onpointerup = ()=>{ skip=true; };
    const t0=performance.now();
    requestAnimationFrame(function step(){
      const H=col.offsetHeight;
      const dur=Math.max(16000, H*20);
      const k=Math.min(1,(performance.now()-t0)/dur);
      col.style.transform=`translate(-50%, ${innerHeight - (innerHeight+H)*k}px)`;
      if(k>=1 || skip){ ov.classList.add("hidden"); res(); }
      else requestAnimationFrame(step);
    });
  });
}

/* ---------------- 영상 플레이어 (프로포즈 영상 · 영상편지 공용) ----------------
   opt: { file, title, skippable, missingTitle, missingNote } — 파일이 없으면 자리표시 + 계속 버튼 */
function playVideo(opt){
  return new Promise(res=>{
    const ov=$("video-letter"), frame=$("vl-frame"), skipBtn=$("btn-vl-skip"), fsBtn=$("btn-vl-fs"), ttl=ov.querySelector(".vl-title");
    frame.innerHTML="";
    ttl.textContent = opt.title || "";
    ov.classList.toggle("vl-full", !!opt.fullscreen); ov.classList.remove("vl-out");
    ov.classList.remove("hidden");
    skipBtn.textContent = "건너뛰기";
    skipBtn.style.display = opt.skippable===false ? "none" : "";
    fsBtn.style.display = "none";
    let done=false;
    const finish=()=>{ if(done)return; done=true;
      // 영상만 전체화면이었을 때만 해제 (게임 전체 전체화면은 유지)
      if(document.fullscreenElement && document.fullscreenElement!==document.documentElement) document.exitFullscreen().catch(()=>{});
      const v=frame.querySelector("video"); if(v) v.pause();
      if(opt.fullscreen){                                  // scale 1→0.88 + 페이드아웃으로 3D 장면에 자연스럽게 복귀
        ov.classList.add("vl-out");
        setTimeout(()=>{ ov.classList.add("hidden"); ov.classList.remove("vl-out","vl-full"); res(); }, 650);
      }else{ ov.classList.add("hidden"); res(); } };
    skipBtn.onclick = ()=>{ sfx("click"); finish(); };
    if(!opt.file){ finish(); return; }
    const v=document.createElement("video");
    v.src = url(opt.file);
    v.playsInline = true; v.controls = false; v.autoplay = true;
    fsBtn.onclick = ()=>{
      sfx("click");
      if(v.requestFullscreen) v.requestFullscreen().catch(()=>{});
      else if(v.webkitRequestFullscreen) v.webkitRequestFullscreen();
      else if(v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    };
    v.addEventListener("ended", ()=>setTimeout(finish, opt.fullscreen ? 150 : 500));
    v.addEventListener("error", ()=>{
      frame.innerHTML =
        '<div class="vl-missing"><b>'+(opt.missingTitle||"영상 자리예요 🎬")+'</b><br><br>' +
        '<span><code>'+url(opt.file)+'</code> 파일을 넣으면<br>'+(opt.missingNote||"이 자리에서 영상이 재생됩니다.")+'</span></div>';
      skipBtn.textContent="계속하기"; skipBtn.style.display="";
    });
    v.addEventListener("canplay", ()=>{ v.play().catch(()=>{}); fsBtn.style.display = opt.fullscreen ? "none" : ""; });
    frame.appendChild(v);
  });
}
function playVideoLetter(){
  const vl=D.videoLetter||{};
  return playVideo({ file: vl.file || (D.videos&&D.videos.letter), title:"♥ 도비의 영상편지 ♥", skippable: vl.skippable!==false,

}

/* ---------------- 액션 핸들러 (Interaction & Anim) ---------------- */
/* 캐릭터를 수평으로만 회전시켜 (x,z)를 바라보게 함.
   lookAt은 때때로 180° 뒤집힌 오일러 표현을 만들고, 매 프레임 idle 애니메이션이
   z축만 덮어쓰면서 캐릭터가 실제로 뒤집혀 땅에 묻히는 버그가 있어 이 헬퍼로 대체. */
function faceTo(obj, x, z){
  obj.rotation.set(0, Math.atan2(x-obj.position.x, z-obj.position.z), 0);
}
function moveChar(ch, to, dur){
  const from = ch.position.clone();
  faceTo(ch, to.x, to.z);
  const steps = Math.max(2, Math.round(from.distanceTo(to)*1.6));
  return tweenP(dur, k=>{
    ch.position.lerpVectors(from, to, k);
    ch.position.y = from.y + Math.abs(Math.sin(k*Math.PI*steps))*.07;   // 총총 걸음 (작게)
    walkPose(ch, k, steps/2);                                             // 팔·다리 교차
  }).then(()=>restPose(ch));
}
/* 플레이어 탭 대기: 이 동안만 카메라 조작(드래그/줌) 허용 */
function waitForTap(targetName, hintText, markerObj, markerY){
  if(hintText) hint(hintText);
  if(markerObj) setMarker(markerObj, markerY);
  tapLocked=false; currentTargetName=targetName; camFree=true;
  return new Promise(r=>{ onTargetHit=r; }).then(()=>{
    tapLocked=true; currentTargetName=null; camFree=false; clearMarker(); hint(null); clearGuideGlow();
  });
}
/* 다음 클릭 대상 위에 맥동하는 글로우 — 카메라 안내와 함께 사용. 탭이 끝나면 자동 제거 */
let guideGlow=null;
function setGuideGlow(pos, size){
  clearGuideGlow();
  const g=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false, depthTest:false, opacity:.85}));
  g.position.copy(pos); g.renderOrder=998; scene.add(g);
  let t=0; const iv=setInterval(()=>{ t+=.12; g.scale.setScalar((size||1)*(1+Math.sin(t*3)*.22)); g.material.opacity=.55+Math.sin(t*3)*.3; }, 33);
  guideGlow={g, iv};
}
function clearGuideGlow(){ if(guideGlow){ clearInterval(guideGlow.iv); scene.remove(guideGlow.g); guideGlow=null; } }
/* 눈물: 눈가에서 아래로 떨어지는 물방울 몇 개 */
function tears(ch, n){
  const s=ch.scale.x, dir=new THREE.Vector3(Math.sin(ch.rotation.y),0,Math.cos(ch.rotation.y));
  const side=new THREE.Vector3(dir.z,0,-dir.x);
  const tex=dotTexture("#a9d4ff");
  for(let i=0;i<(n||6);i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
    const k=(i%2?1:-1);
    sp.position.copy(ch.position).addScaledVector(dir,.48*s).addScaledVector(side,.17*s*k).add(new THREE.Vector3(0,1.08*s,0));
    sp.scale.setScalar(.11+Math.random()*.05);
    liveParticles.push({s:sp, v:new THREE.Vector3(side.x*.25*k, .05, side.z*.25*k).addScaledVector(dir,.15), life:.9, age:-i*.12});
    scene.add(sp);
  }
}
/* 화면 아무 곳이나 탭 대기 (미니게임 훅 사용) */
function waitForScreenTap(hintText){
  if(hintText) hint(hintText);
  camFree=false;
  return new Promise(r=>{ minigameTap=r; }).then(()=>{ minigameTap=null; hint(null); });
}
/* ---- 감정 클로즈업: 카메라가 얼굴 앞으로 짧게 → 볼터치·표정 + (있으면) PNG 컷인 → 원래 구도로 복귀 ---- */
async function faceCloseup(ch, role, expr){
  const snap=camSnapshot();
  const s=ch.scale.x, face=ch.position.clone().add(new THREE.Vector3(0,1.12*s,0));
  const dir=new THREE.Vector3(Math.sin(ch.rotation.y),0,Math.cos(ch.rotation.y));
  const side=new THREE.Vector3(dir.z,0,-dir.x);
  const camPos=face.clone().addScaledVector(dir,2.9).addScaledVector(side,.8).add(new THREE.Vector3(0,.3,0));
  await camLookTween(camPos, face, 900);
  setExpression(ch, expr||"blush");
  const P=ch.userData.parts;
  if(P&&P.HEAD) tweenP(600, k=>{ P.HEAD.rotation.x = Math.sin(k*Math.PI)*.22 - (ch.userData.headBase||0); });
  burst(face.clone().add(new THREE.Vector3(0,.55,0)), TEX_HEART, 5, .7, 1.4);
  await Promise.all([showCutin(role, 1700), wait(1900)]);
  setExpression(ch, "happy");
  await camTween(snap, 900);
  setExpression(ch, "normal");
}
/* 버스 문 열고 닫기 (0: 닫힘 ~ 1: 열림) */
function setBusDoors(bus, k){

const ACTIONS = {

  /* ■ R1-프렐류드: 밖에서 안을 보던 도비가 문을 열고 입장 → 카메라가 따라 들어옴 */
