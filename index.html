  /* ■ R2-C: 낚시 — 도비가 낚싯대로 걸어가고(카메라 팔로우) → 어깨 너머 구도 → 미니게임 → 반지 상자 부상 → 도비 손으로 */
  fishing_minigame(){
    return new Promise(async res=>{
      const bobber = interactives.OBJ_BOBBER;
      const baseY = .06;
      setExpression(charDobby,"normal");
      // 도비 이동 — 옆에서 부드럽게 따라감 (멀리 테이블의 엥주도 잠깐 보임)
      const follow = camTween({ theta:Math.PI*.36, phi:Math.PI/3.0, radius:wide(6.4), tx:-1.2, ty:.8, tz:-.6 }, 1500);
      await moveChar(charDobby, new THREE.Vector3(-1.5,0,-.4), 1300);
      faceTo(charDobby, bobber.position.x, bobber.position.z);
      await follow;
      // 어깨 너머(오버숄더): 도비 · 낚싯대 · 물 · 찌가 한 화면에
      await camLookTween(new THREE.Vector3(.5, 3.0, 3.4), new THREE.Vector3(-1.45, .35, -3.0), 1300);
      hint("찌가 쑥 내려가는 순간, 화면을 탭! (드래그 말고 짧게 탭)");
      let window_=false, success=false, running=true, bobT=0;
      const exM=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_MARK, transparent:true, depthTest:false}));
      exM.scale.setScalar(.7); exM.visible=false; exM.renderOrder=999; scene.add(exM);
      const loop = async ()=>{
        while(running && !success){
          await wait(1400 + Math.random()*1800);
          if(!running || success) break;
          window_=true; exM.visible=true;
          exM.position.set(bobber.position.x, .9, bobber.position.z);
          sfx("click");
          const t0=performance.now();
          while(performance.now()-t0 < 850 && window_ && !success) await wait(30);
          window_=false; exM.visible=false;
        }
      };
      minigameTap = ()=>{
        if(window_){ success=true; window_=false; }
        else burst(bobber.position.clone().add(new THREE.Vector3(0,.2,0)), dotTexture("#9ec8ff"), 4, 1, .7);
      };
      const bobAnim = setInterval(()=>{ bobT += .08; bobber.position.y = window_ ? baseY-.28 : baseY + Math.sin(bobT)*.045; }, 33);
      loop();
      while(!success) await wait(60);
      running=false; clearInterval(bobAnim); minigameTap=null;
      exM.visible=false; scene.remove(exM);
      hint(null);
      bobber.position.y = baseY;
      sfx("shutter");
      // 반지 상자 — 이 오브젝트가 프로포즈까지 그대로 이어짐
      const ringBox=new THREE.Group(); ringBox.name="RING_BOX";
      const rb=new THREE.Mesh(new THREE.BoxGeometry(.32,.24,.32), toon(0x8e2f3c)); rb.position.y=.12;
      const ring=new THREE.Mesh(new THREE.TorusGeometry(.09,.025,10,20), new THREE.MeshToonMaterial({color:0xffd970}));
      ring.position.y=.3; ring.rotation.x=Math.PI/2;
      const gem=new THREE.Mesh(new THREE.SphereGeometry(.045,10,8), new THREE.MeshBasicMaterial({color:0xbfefff})); gem.position.y=.34;
      ringBox.add(rb,ring,gem);
      ringBox.position.copy(bobber.position); scene.add(ringBox);
      interactives.OBJ_RING = ringBox;
      // 물에서 올라옴 — 이 중요한 순간에만 Until I Found You가 처음 들어옴
      const up = bobber.position.clone().add(new THREE.Vector3(0,1.5,0));
      if(curEp && curEp.eventBgm) playBGM(curEp.eventBgm, {volume:curEp.eventBgmVolume!=null?curEp.eventBgmVolume:.12, fadeMs:900, crossfadeMs:500});
      burst(bobber.position.clone(), dotTexture("#9ec8ff"), 10, 1.4, .9);
      camLookTween(new THREE.Vector3(up.x+1.3, up.y+.6, up.z+2.2), up.clone().add(new THREE.Vector3(0,-.1,0)), 1300);
      await tweenP(1300, k=>{ ringBox.position.y = bobber.position.y + 1.5*Math.sin(k*Math.PI/2); ringBox.rotation.y = k*Math.PI*2; });
      burst(up, TEX_SPARK, 12, 1.2, 1.2);
      await wait(700);
      // 같은 반지 상자가 도비 손으로 (도비가 손을 앞으로 내밀어 받음)
      const P=charDobby.userData.parts;
      if(P&&P.ARM_R) tweenP(500, k=>{ P.ARM_R.rotation.x = -1.35*k; });
      const from=ringBox.position.clone();
      const handTarget=()=>{ const v=new THREE.Vector3(); P.HAND_R.getWorldPosition(v); return v; };
      await camTween({ theta:Math.PI*.3, phi:Math.PI/2.9, radius:wide(4.2), tx:charDobby.position.x, ty:1.0, tz:charDobby.position.z }, 1100);
      await tweenP(900, k=>{ const to=handTarget(); ringBox.position.lerpVectors(from,to,k); ringBox.position.y += Math.sin(k*Math.PI)*.4; ringBox.rotation.y = k*Math.PI*2; });
      // 손에 붙이기 (이후 이동·프로포즈까지 같은 오브젝트)
      const hand=P.HAND_R; const inv=new THREE.Matrix4().copy(hand.matrixWorld).invert();
      scene.remove(ringBox); ringBox.applyMatrix4(inv); ringBox.position.set(0,.05,.09); ringBox.rotation.set(0,0,0);
      ringBox.scale.setScalar(1/ (charDobby.scale.x)); hand.add(ringBox);
      setExpression(charDobby,"happy");
      burst(handTarget().add(new THREE.Vector3(0,.4,0)), TEX_HEART, 10, 1.4, 1.5);
      await wait(800);
      setExpression(charDobby,"normal");
      res();
    });
  },
  /* ■ R2-D: 풀백(도비 + 테이블의 엥주 한 프레임) → 반지를 들고 엥주에게 걸어감(옆에서 팔로우) → 테이블 앞 미디엄 클로즈업 */

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();

function handleTap(x,y){
  if(minigameTap){ minigameTap(); return; }
  if(tapLocked || !currentTargetName) return;

  if(!t) return;
  pointer.x=(x/innerWidth)*2-1; pointer.y=-(y/innerHeight)*2+1;

/* ---------------- 인터랙션 실행 루프 ----------------
   { target, action, hint }          : 대상 탭 대기 → 액션
   { auto:true, action }             : 자동 진행
   dialogue                          : 액션 뒤 대사
   after                             : 대사 뒤 후속 액션 (감정 클로즈업 · 작별 등)
   before                            : 탭 대기 전 연출 (카메라 프레이밍 등)
   phase:"prelude"                   : 라운드 카드보다 먼저 */
async function runInts(list){
  for(const it of list){
    if(!ACTIONS[it.action]) continue;
    if(it.before && ACTIONS[it.before]) await ACTIONS[it.before](it);   // 탭 대기 전 연출(카메라 프레이밍 등)
    if(!it.auto){
      const target = interactives[it.target];
      if(!target) continue;                              // 이 배경에 없는 대상이면 건너뜀
      const yOff = it.markerY!=null ? it.markerY : (it.target.startsWith("CHAR") ? 1.5 : (it.target==="OBJ_DOOR" ? 2.7 : (it.target==="OBJ_BUS" ? 3.6 : 1.0)));
      await waitForTap(it.target, it.hint, target, yOff);
    }
    await ACTIONS[it.action](it);
    if(it.dialogue && it.dialogue.length) await playDialogue(it.dialogue);
    if(it.after && ACTIONS[it.after]) await ACTIONS[it.after](it);
  }
}

async function runEpisode(ep){
  curEp = ep;
  await sceneTransition(()=>{ (BUILDERS[ep.background] || buildRoom)(); applyCustomModels(ep.background); });
  if(ep.bgm) playBGM(ep.bgm, {volume:ep.bgmVolume!=null?ep.bgmVolume:.30, fadeMs:850, crossfadeMs:750});
  else stopBGM(650);
  const ints = ep.interactions || [];
  const preludes = ints.filter(i => i.phase === "prelude");
  if(ep.background==="mullae") await mullaeOpening();       // 창문 클로즈업 → 도비 등장
  await runInts(preludes);                                  // 문 열고 입장 등
  // 라운드 카드를 먼저 보여준 뒤에 입장 카메라 연출을 시작한다.
  // (예전엔 카드와 동시에 시작해서, 카드가 사라질 땐 이미 연출이 끝나 있었음)
  if(ep.id !== D.flow[0]) await showIntro(ep);              // 첫 라운드는 타이틀 인트로 카드가 대신함
  if(!preludes.length) await (ENTRY_CAM[ep.background] || defaultEntryCam)();
  await runInts(ints.filter(i => i.phase !== "prelude"));
  if(ep.dialogue && ep.dialogue.length) await playDialogue(ep.dialogue);
  // 실제 사진 (폴라로이드 · 간직하기)
  for(const f of (ep.realPhotos||[])){
    const file = typeof f==="string" ? f : f.file;
    const label = typeof f==="string" ? (ep.date + " · " + ep.location) : (f.label || (ep.date + " · " + ep.location));
    for(const ph of await expandPhotos([{file, label}])) await showPhoto(ph.file, label);   // _1 사진이 있으면 이어서 한 장 더
  }
  // 에필로그: 유리병 나레이션 (해변 전용)
  if(ep.epilogue && ep.epilogue.narration && ep.epilogue.narration.length && ep.background==="beach"){
    await runBottleLetter(ep.epilogue);
  }
  if(ep.systemNotice){
    // 피날레: 평생 주민권 → 엔딩 크레딧 → 마지막 문구 (BGM 유지)
    if(D.certificate && D.certificate.title) await showCertificate(D.certificate);
    if(D.credits && D.credits.length) await runCredits(D.credits);
    if(bgmEl.cur) await setBGMVolume(.25, 700, true);
    $("notice-main").textContent = ep.systemNotice;
    $("notice-sub").textContent = "— 우리의 진짜 이야기는 지금부터 —";
    $("final-notice").classList.remove("hidden");
    const gp=new THREE.Vector3(0,2,0);
    setInterval(()=>burst(gp.clone().add(new THREE.Vector3((Math.random()-.5)*3,0,(Math.random()-.5)*3)), TEX_HEART, 2, .8, 2.6), 900);
    return;
  }
  nextFlow();
}

/* ---------------- 흐름 컨트롤러 ---------------- */
let flowIndex=0, curEp=null;
function nextFlow(){
  const id = D.flow[flowIndex++];
  if(!id) return;
  const ep = D.episodes.find(e=>e.id===id);
  if(ep){ runEpisode(ep); return; }
  const m = D.montages.find(x=>x.id===id);
  if(m){ runMontage(m).then(nextFlow); return; }
  if(D.starfall && D.starfall.id===id){ runStarfall(D.starfall).then(nextFlow); return; }
  console.warn("flow에 정의된 id를 찾을 수 없음:", id);
  nextFlow();
}

/* ---------------- 메인 루프 ---------------- */
let prev=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-prev)/1000); prev=now;
  // 트윈
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    const k=Math.min(1,(now-tw.t0)/tw.dur);
    tw.onUpdate(tw.ease(k));
    if(k>=1){ tweens.splice(i,1); if(tw.onDone) tw.onDone(); }
  }
  updateParticles(dt);
  updateSnow(dt);
  updateMarker(now/1000);
  // 캐릭터 아이들 모션 (살랑살랑 · 작게)
  const idle=Math.sin(now/1000*2.2)*.014;
  if(charDobby && !charDobby.userData.noIdle) charDobby.rotation.z = idle;
  if(charEngju && !charEngju.userData.noIdle) charEngju.rotation.z = -idle;
  applyOrbit();
  renderer.render(scene,camera);
}

      canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      flakes=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,
        r:(near?1.5:.7)+Math.random()*(near?3.6:2.0), vy:(near?.45:.18)+Math.random()*(near?1.1:.55),
        vx:(Math.random()-.5)*(near?.42:.18), a:(near?.42:.20)+Math.random()*(near?.48:.32), ph:Math.random()*Math.PI*2}));
    }
    function tick(){
      if(!titleFxOn){ ctx.clearRect(0,0,w,h); return; }
      ctx.clearRect(0,0,w,h);
      for(const f of flakes){
        f.ph+=.008; f.x+=f.vx+Math.sin(f.ph)*.08; f.y+=f.vy;
        if(f.y>h+10){f.y=-10;f.x=Math.random()*w;} if(f.x<-10)f.x=w+10; if(f.x>w+10)f.x=-10;
        ctx.beginPath(); ctx.fillStyle=`rgba(255,255,255,${f.a})`;
        ctx.shadowColor=near?"rgba(255,240,218,.34)":"transparent"; ctx.shadowBlur=near?7:0;
        ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    addEventListener("resize",resize,{passive:true}); resize(); requestAnimationFrame(tick);
  }
  setup(document.getElementById("ti-snowBack"), 95, false);
  setup(document.getElementById("ti-snowFront"), 48, true);
})();

/* ---------------- 시작 ---------------- */
async function boot(){
  D = loadSavedData();                 // 이 브라우저 저장본 우선, 없으면 GAME_DATA
  CFG = D.config; BASE = CFG.assetBase || "assets/";
  await loadUploadedAssets();          // 관리자에서 업로드한 파일들
  loadFont();

  const first = D.episodes.find(e => e.id === D.flow[0]);
  (BUILDERS[first && first.background] || buildMullae)();   // 타이틀 뒤 배경
  applyOrbit();
  $("fader").style.opacity = 0;

  // 타이틀 배경: assets/images/intro_winter_village.webp 가 있으면 내장 이미지 대신 사용
  if(CFG.introImage){
    const probe=new Image();
    probe.onload=()=>{ document.querySelector("#title-screen .ti-plate").style.backgroundImage = 'url("'+url(CFG.introImage)+'")'; };
    probe.src=url(CFG.introImage);
  }
  // 타이틀 BGM(캐럴): 브라우저 정책상 첫 터치/클릭이 있어야 재생 가능 → 첫 제스처에 시작
  let titleStarted=false, titleBgmOn=false;
  const startTitleBgm=()=>{ if(titleBgmOn||titleStarted) return; titleBgmOn=true; initAudio(); if(CFG.titleBgm) playBGM(CFG.titleBgm); };
  addEventListener("pointerdown", startTitleBgm, {once:true});
  addEventListener("keydown", startTitleBgm, {once:true});

  $("btn-start").addEventListener("click", async ()=>{
    if(titleStarted) return; titleStarted=true;
    // 시작 버튼을 누르는 순간 화면 전체화면 (PC·안드로이드. 아이폰은 '홈 화면에 추가'로 실행)
    try{
      const de=document.documentElement;
      if(!document.fullscreenElement){
        if(de.requestFullscreen) de.requestFullscreen({navigationUI:"hide"}).catch(()=>{});
        else if(de.webkitRequestFullscreen) de.webkitRequestFullscreen();
      }
    }catch(e){}
    initAudio();
    sfx("click");
    if(!titleBgmOn && CFG.titleBgm){ titleBgmOn=true; playBGM(CFG.titleBgm); }
    // 이 클릭(사용자 제스처) 안에서 아카이 BGM을 0볼륨으로 미리 실행해 둔다.
    // 실제 아카이 장면 진입 시 currentTime=0으로 되감고 0.85초 페이드인한다.
    const firstEpForAudio = D.episodes.find(e => e.id === D.flow[0]);
    if(firstEpForAudio && firstEpForAudio.bgm) primeBGM(firstEpForAudio.bgm);
    $("title-screen").classList.add("playing");   // UI 페이드아웃 → 약 3초 줌인 → '2024.12.28 / 우리의 첫 번째 만남' 카드
    await wait(4900);
    $("fader").style.opacity = 1; await wait(850);
    stopTitleFx();
    $("title-screen").classList.add("hidden");
    nextFlow();
  });
}
boot();

})();
</script>
