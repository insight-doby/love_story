<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>엥주와 도비 — Project: E&D</title>
<style>
  /* ============ 글로벌 톤앤매너: 동물의 숲 스타일 (GDD 2.1) ============ */
  :root{
    --cream:#FFF7E6;
    --paper:#FFFDF4;
    --wood:#8C6A4F;
    --brown:#5B4A3A;
    --leaf:#7FBF7F;
    --acorange:#E8A33D;
    --blush:#F2A6A0;
    --night:#2B2620;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--night);}
  body{
    font-family:'CozyRound','BM JUA','Jua',ui-rounded,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--brown);
    user-select:none;-webkit-user-select:none;
  }
  #game-canvas{position:fixed;inset:0;display:block;touch-action:none;}

  /* ---------- 공통 오버레이 ---------- */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50;}
  .hidden{display:none !important;}
  #fader{position:fixed;inset:0;background:var(--night);z-index:90;opacity:1;transition:opacity .8s ease;pointer-events:none;}
  #flash{position:fixed;inset:0;background:#fff;z-index:95;opacity:0;pointer-events:none;transition:opacity .12s ease;}

  /* ---------- 타이틀 ---------- */
  #title-screen{background:radial-gradient(ellipse at 50% 30%, #4a6b4a 0%, #2f4a35 55%, #22331f 100%);z-index:80;}
  .title-card{background:var(--paper);border-radius:32px;padding:36px 44px;text-align:center;
    box-shadow:0 12px 0 rgba(0,0,0,.18), inset 0 0 0 6px #F3E2BC;max-width:88vw;}
  .title-eyebrow{font-size:14px;letter-spacing:.2em;color:var(--acorange);margin-bottom:8px;}
  .title-main{font-size:clamp(30px,7vw,52px);color:var(--brown);line-height:1.15;}
  .title-main .amp{color:var(--blush);}
  .title-sub{margin-top:10px;font-size:14px;color:#9a8a76;}
  .btn{
    display:inline-block;margin-top:26px;background:var(--acorange);color:#fff;border:none;cursor:pointer;
    font-family:inherit;font-size:20px;padding:14px 40px;border-radius:999px;
    box-shadow:0 6px 0 #c07f1f;transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c07f1f;}
  .btn.ghost{background:#fff;color:var(--brown);box-shadow:0 6px 0 #d8c8ae;font-size:16px;padding:10px 26px;}
  .btn.ghost:active{box-shadow:0 2px 0 #d8c8ae;}

  /* ---------- 라운드 인트로 카드 ---------- */
  #round-intro{z-index:70;pointer-events:none;background:transparent;}
  .intro-card{background:rgba(255,253,244,.96);border-radius:26px;padding:24px 40px;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.15), inset 0 0 0 5px #F3E2BC;
    opacity:0;transform:scale(.9);transition:opacity .5s ease, transform .5s ease;}
  .intro-card.show{opacity:1;transform:scale(1);}
  .intro-date{font-size:15px;color:var(--acorange);letter-spacing:.12em;}
  .intro-loc{font-size:clamp(22px,5.5vw,34px);margin-top:6px;}

  /* ---------- 힌트 배너 ---------- */
  #hint{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    background:rgba(43,38,32,.88);color:#FFF3D6;font-size:14px;line-height:1.55;padding:10px 20px;
    border-radius:18px;z-index:40;width:max-content;max-width:min(560px,90vw);text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .4s ease;}

  /* ---------- 대사창 (동숲 스타일) ---------- */
  #dialogue-box{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(18px + env(safe-area-inset-bottom));width:min(680px,92vw);z-index:60;cursor:pointer;}
  .speaker-plate{position:absolute;top:-18px;left:22px;background:var(--acorange);color:#fff;
    font-size:16px;padding:7px 20px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.15);}
  .speaker-plate.engju{background:var(--blush);}
  .speaker-plate.system{background:#7c8fbf;}
  .dlg-body{background:var(--paper);border-radius:24px;padding:26px 24px 20px;min-height:96px;
    box-shadow:0 8px 0 rgba(0,0,0,.18), inset 0 0 0 5px #F3E2BC;font-size:clamp(16px,4.3vw,19px);line-height:1.55;}
  .dlg-body .direction{color:#a4917a;font-size:.85em;}
  .dlg-next{position:absolute;right:20px;bottom:12px;color:var(--acorange);font-size:18px;
    animation:bob 1s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}

  /* ---------- 폴라로이드 팝업 ---------- */
  #photo-popup{background:rgba(30,26,22,.72);backdrop-filter:blur(3px);z-index:75;}
  .polaroid{background:#fff;padding:14px 14px 0;border-radius:6px;transform:rotate(-2.5deg);
    box-shadow:0 18px 40px rgba(0,0,0,.45);animation:drop .55s cubic-bezier(.2,1.4,.4,1);}
  @keyframes drop{from{transform:rotate(6deg) translateY(-60px) scale(.8);opacity:0;}
    to{transform:rotate(-2.5deg) translateY(0) scale(1);opacity:1;}}
  .polaroid img,.polaroid canvas{display:block;width:min(66vw,340px);height:auto;aspect-ratio:4/3;object-fit:cover;background:#eee;border-radius:2px;}
  .polaroid .cap{text-align:center;padding:12px 4px 16px;font-size:15px;color:#5B4A3A;}

  /* ---------- 몽타주 ---------- */
  #montage{background:linear-gradient(180deg,#3a3128 0%, #241f19 100%);z-index:78;}
  .mont-slide{display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .5s ease;}
  .mont-slide.show{opacity:1;}
  .mont-date{color:var(--acorange);font-size:16px;letter-spacing:.15em;margin-bottom:14px;}
  .mont-photo{background:#fff;padding:12px 12px 34px;border-radius:5px;box-shadow:0 14px 34px rgba(0,0,0,.5);transform:rotate(1.5deg);}
  .mont-photo img,.mont-photo canvas{display:block;width:min(70vw,360px);aspect-ratio:4/3;object-fit:cover;background:#ddd;}
  .mont-cap{margin-top:22px;color:#FFF3D6;font-size:clamp(15px,4.2vw,19px);text-align:center;max-width:82vw;line-height:1.5;}
  .mont-dots{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;gap:8px;}
  .mont-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);}
  .mont-dots i.on{background:var(--acorange);}
  .mont-tip{position:absolute;top:calc(16px + env(safe-area-inset-top));color:rgba(255,243,214,.55);font-size:12px;}

  /* ---------- 영상편지 ---------- */
  #video-letter{background:rgba(20,16,12,.92);z-index:85;}
  .vl-frame{background:#fff;padding:14px;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .vl-frame video{display:block;width:min(88vw,560px);max-height:60vh;border-radius:4px;background:#000;}
  .vl-title{color:#FFF3D6;font-size:18px;margin-bottom:16px;}
  .vl-missing{width:min(88vw,560px);aspect-ratio:16/9;border-radius:4px;background:#1d1a16;color:#cbb894;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-size:14px;line-height:1.7;padding:20px;border:2px dashed #6b5c45;}
  .vl-missing b{color:#FFF3D6;font-size:16px;}
  .vl-missing code{background:#2e281f;padding:2px 8px;border-radius:6px;font-family:monospace;font-size:13px;color:#f0c674;}

  /* ---------- 피날레 시스템 알림 ---------- */
  #final-notice{z-index:82;background:transparent;pointer-events:none;justify-content:flex-end;padding-bottom:calc(30px + env(safe-area-inset-bottom));}
  .notice-card{pointer-events:auto;background:rgba(255,253,244,.97);border-radius:26px;padding:26px 34px;text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.2), inset 0 0 0 5px #F3E2BC;max-width:90vw;
    animation:noticePulse 2.2s ease-in-out infinite;}
  @keyframes noticePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
  .notice-eyebrow{font-size:13px;color:#7c8fbf;letter-spacing:.18em;margin-bottom:8px;}
  .notice-main{font-size:clamp(19px,5vw,26px);line-height:1.5;}
  .notice-sub{margin-top:14px;font-size:13px;color:#a4917a;}
  /* ---------- 별똥별 소원 ---------- */
  #wish{position:fixed;top:20%;left:50%;transform:translateX(-50%) scale(.9);z-index:65;
    background:rgba(18,15,32,.85);border:2px solid rgba(255,220,150,.65);border-radius:22px;
    padding:22px 36px;box-shadow:0 0 34px rgba(255,215,140,.45), inset 0 0 18px rgba(255,220,150,.12);
    color:#FFF6DC;font-size:clamp(19px,5vw,30px);text-align:center;width:max-content;max-width:min(92vw,720px);
    box-sizing:border-box;word-break:keep-all;line-height:1.6;
    text-shadow:0 0 14px rgba(255,220,150,.9), 0 2px 4px rgba(0,0,0,.6);
    opacity:0;transition:opacity .45s ease, transform .45s ease;pointer-events:none;}
  #wish.show{opacity:1;transform:translateX(-50%) scale(1);}
  #star-cue{position:fixed;left:-100px;top:-100px;transform:translate(-50%,-135%);z-index:66;
    color:#FFE9A8;font-size:clamp(14px,3.8vw,18px);font-weight:700;white-space:nowrap;pointer-events:none;
    text-shadow:0 0 10px rgba(255,220,150,.95), 0 2px 4px rgba(0,0,0,.7);
    opacity:0;transition:opacity .25s ease;}
  #star-cue.show{opacity:1;animation:cueBob .7s ease-in-out infinite;}
  @keyframes cueBob{0%,100%{margin-top:0;}50%{margin-top:7px;}}

  /* ---------- 평생 주민권 증서 ---------- */
  #certificate{background:rgba(25,20,16,.8);backdrop-filter:blur(3px);z-index:83;}
  .cert{position:relative;background:#FFFBEE;border-radius:14px;padding:34px 30px 30px;max-width:min(88vw,440px);text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.5);border:3px solid #D9B65C;outline:2px solid #F3E2BC;outline-offset:-9px;
    animation:drop .55s cubic-bezier(.2,1.4,.4,1);}
  .cert-title{font-size:clamp(20px,5.5vw,26px);color:#8a6a20;letter-spacing:.08em;}
  .cert-name{font-size:clamp(26px,7vw,36px);margin-top:14px;color:var(--brown);}
  .cert-role{margin-top:6px;color:#a4917a;font-size:14px;}
  .cert-body{margin-top:16px;font-size:14px;line-height:1.7;color:var(--brown);}
  .cert-foot{margin-top:22px;display:flex;justify-content:space-between;font-size:12.5px;color:#a4917a;gap:10px;flex-wrap:wrap;}
  .stamp{position:absolute;right:16px;bottom:50px;width:76px;height:76px;border:4px solid rgba(217,83,79,.85);
    border-radius:50%;color:rgba(217,83,79,.92);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;
    transform:rotate(-14deg) scale(3);opacity:0;line-height:1.25;text-align:center;}
  .stamp.in{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes stampIn{from{transform:rotate(-32deg) scale(3);opacity:0;}to{transform:rotate(-14deg) scale(1);opacity:1;}}

  /* ---------- 엔딩 크레딧 ---------- */
  #credits{background:linear-gradient(180deg,#171310 0%, #241d16 100%);z-index:84;overflow:hidden;}
  #credits-col{position:absolute;left:50%;top:0;width:min(90vw,540px);transform:translate(-50%,100vh);text-align:center;}
  .cr-line{color:#FFF3D6;font-size:clamp(16px,4.5vw,21px);margin:28px 0;line-height:1.5;}
  .cr-line.end{color:#F2A6A0;margin-top:64px;font-size:clamp(18px,5vw,24px);}
  .cr-line.wedding{color:#FFD98A;margin-top:56px;font-size:clamp(17px,4.8vw,23px);letter-spacing:.04em;
    text-shadow:0 0 16px rgba(255,215,140,.55);}

  /* ---------- 하트 콜라주 (피날레 · 소용돌이 뒤) ---------- */
  #heart-collage{background:rgba(24,19,15,.92);backdrop-filter:blur(3px);z-index:80;
    flex-direction:column;}
  .hc-title{color:#FFF3D6;font-size:clamp(16px,4.6vw,22px);text-align:center;line-height:1.5;
    margin-bottom:8px;max-width:88vw;text-shadow:0 2px 6px rgba(0,0,0,.5);}
  #hc-board{position:relative;width:min(92vw,560px);aspect-ratio:1/0.95;}
  .hc-photo{position:absolute;width:23%;background:#fff;padding:3.2% 3.2% 5.5%;border-radius:3px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);cursor:pointer;opacity:0;
    animation:hcDrop .55s cubic-bezier(.2,1.4,.4,1) forwards;}
  .hc-photo img,.hc-photo canvas{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee;}
  @keyframes hcDrop{from{opacity:0;margin-top:-26px;}to{opacity:1;margin-top:0;}}
  .hc-tip{color:rgba(255,243,214,.6);font-size:12.5px;margin-top:10px;}
  #hc-viewer{position:fixed;inset:0;background:rgba(15,12,9,.9);z-index:86;display:flex;
    flex-direction:column;align-items:center;justify-content:center;}
  #hc-viewer.hidden{display:none;}
  .hcv-photo{background:#fff;padding:14px 14px 0;border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.55);
    animation:drop .4s cubic-bezier(.2,1.4,.4,1);touch-action:pan-y;}
  .hcv-photo img,.hcv-photo canvas{display:block;width:min(76vw,420px);aspect-ratio:4/3;object-fit:cover;background:#eee;border-radius:2px;}
  .hcv-cap{text-align:center;padding:12px 4px 16px;font-size:15px;color:#5B4A3A;}
  .hcv-nav{display:flex;gap:14px;align-items:center;margin-top:20px;}
  .hcv-nav .btn{padding:10px 22px;}
  .hcv-count{color:#FFF3D6;font-size:13px;min-width:52px;text-align:center;}
  .hcv-tip{color:rgba(255,243,214,.55);font-size:12px;margin-top:12px;}
  .cr-photo{display:flex;justify-content:center;margin:20px 0;}
  .cr-photo img,.cr-photo canvas{width:min(46vw,220px);aspect-ratio:4/3;object-fit:cover;background:#fff;
    padding:8px 8px 22px;border-radius:4px;transform:rotate(-2deg);box-shadow:0 10px 26px rgba(0,0,0,.5);box-sizing:content-box;}
  .cr-tip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,243,214,.4);font-size:12px;}

/* ---------- 큰 화면(TV·PC 브라우저로 직접 열람) 대응 ----------
   폰 미러링/캐스팅은 화면 그대로 확대되는 것이라 문제없지만,
   실제로 넓은 뷰포트에서 브라우저를 여는 경우엔 아래 규칙으로
   텍스트·박스가 자동으로 커져서 소파 거리에서도 읽기 편해짐. */
@media (min-width: 900px){
  .title-main{font-size:clamp(52px,4.8vw,84px);}
  .intro-loc{font-size:clamp(30px,3vw,44px);}
  #dialogue-box{width:min(880px,60vw);}
  .dlg-body{font-size:clamp(20px,2.1vw,26px)!important;}
  .mont-cap{font-size:clamp(19px,2vw,25px);max-width:60vw;}
  .mont-photo img,.mont-photo canvas{width:min(420px,32vw);}
  .polaroid img,.polaroid canvas{width:min(400px,30vw);}
  .vl-frame video,.vl-missing{width:min(720px,55vw);}
  .notice-main{font-size:clamp(28px,2.6vw,38px);}
  #wish{font-size:clamp(26px,2.6vw,40px);max-width:min(70vw,900px);}
  .cert{max-width:min(560px,42vw);padding:44px 40px 38px;}
  .cert-title{font-size:clamp(26px,2.6vw,32px);}
  .cert-name{font-size:clamp(32px,3.4vw,44px);}
  .cert-body{font-size:clamp(16px,1.6vw,19px)!important;}
  .cr-line{font-size:clamp(20px,2.2vw,27px);}
  .cr-line.end{font-size:clamp(23px,2.5vw,30px);}
  .cr-line.wedding{font-size:clamp(21px,2.3vw,28px);}
  #credits-col{width:min(720px,54vw);}
  .hc-title{font-size:clamp(20px,2.2vw,27px);}
  #hc-board{width:min(760px,58vw);}
  .hcv-photo img,.hcv-photo canvas{width:min(520px,40vw);}
  .btn{font-size:clamp(15px,1.4vw,18px);padding:14px 26px;}
}
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="fader"></div>
<div id="flash"></div>

<div id="title-screen" class="overlay">
  <div class="title-card">
    <div class="title-eyebrow">PROJECT : E &amp; D</div>
    <div class="title-main">엥주 <span class="amp">♥</span> 도비</div>
    <div class="title-sub">우리의 이야기를 담은 작은 디오라마</div>
    <button class="btn" id="btn-start">이야기 시작하기</button>
  </div>
</div>

<div id="round-intro" class="overlay hidden">
  <div class="intro-card" id="intro-card">
    <div class="intro-date" id="intro-date"></div>
    <div class="intro-loc" id="intro-loc"></div>
  </div>
</div>

<div id="hint" class="hidden"></div>

<div id="dialogue-box" class="hidden">
  <div class="speaker-plate" id="speaker-plate">도비</div>
  <div class="dlg-body" id="dlg-text"></div>
  <div class="dlg-next" id="dlg-next">▼</div>
</div>

<div id="photo-popup" class="overlay hidden">
  <div class="polaroid" id="polaroid-frame"></div>
  <button class="btn" id="btn-keep-photo" style="margin-top:30px;">간직하기 ♥</button>
</div>

<div id="montage" class="overlay hidden">
  <div class="mont-tip">탭하면 다음으로 넘어가요</div>
  <div class="mont-slide" id="mont-slide">
    <div class="mont-date" id="mont-date"></div>
    <div class="mont-photo" id="mont-photo"></div>
    <div class="mont-cap" id="mont-cap"></div>
  </div>
  <div class="mont-dots" id="mont-dots"></div>
</div>

<div id="video-letter" class="overlay hidden">
  <div class="vl-title">♥ 도비의 영상편지 ♥</div>
  <div class="vl-frame" id="vl-frame"></div>
  <div class="row" style="display:flex;gap:10px;margin-top:22px;">
    <button class="btn ghost" id="btn-vl-fs">⛶ 전체화면</button>
    <button class="btn ghost" id="btn-vl-skip">건너뛰기</button>
  </div>
</div>

<div id="heart-collage" class="overlay hidden">
  <div class="hc-title">우리의 모든 순간이,<br>하나의 마음이 되었어요 ♥</div>
  <div id="hc-board"></div>
  <div class="hc-tip">사진을 누르면 크게 볼 수 있어요</div>
  <button class="btn" id="btn-hc-done" style="margin-top:14px;">간직하기 ♥</button>
</div>
<div id="hc-viewer" class="hidden">
  <div class="hcv-photo" id="hcv-photo"></div>
  <div class="hcv-nav">
    <button class="btn ghost" id="hcv-prev">◀</button>
    <div class="hcv-count" id="hcv-count"></div>
    <button class="btn ghost" id="hcv-next">▶</button>
  </div>
  <div class="hcv-tip">옆으로 넘기거나 바깥을 누르면 닫혀요</div>
</div>

<div id="final-notice" class="overlay hidden">
  <div class="notice-card">
    <div class="notice-eyebrow">SYSTEM</div>
    <div class="notice-main" id="notice-main"></div>
    <div class="notice-sub" id="notice-sub"></div>
  </div>
</div>

<div id="wish"></div>
<div id="star-cue">▼ 별똥별!</div>

<div id="certificate" class="overlay hidden">
  <div class="cert">
    <div class="cert-title" id="cert-title"></div>
    <div class="cert-name" id="cert-name"></div>
    <div class="cert-role" id="cert-role"></div>
    <div class="cert-body" id="cert-body"></div>
    <div class="cert-foot"><span id="cert-date"></span><span id="cert-issuer"></span></div>
    <div class="stamp" id="cert-stamp">도비<br>인증</div>
  </div>
  <button class="btn" id="btn-cert" style="margin-top:26px;">간직하기 ♥</button>
</div>

<div id="credits" class="overlay hidden">
  <div id="credits-col"></div>
  <div class="cr-tip">탭하면 건너뛸 수 있어요</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* ================================================================

/* ================================================================

(function(){
"use strict";
const $ = id => document.getElementById(id);

/* ---------------- 관리자 채널(admin.html) 연동 ----------------
   · 설정(JSON)      : localStorage "ED_GAME_DATA"
   · 업로드한 파일들 : IndexedDB "ED_STUDIO" / store "assets"
   관리자 페이지에서 저장하면 게임을 새로고침할 때 자동 반영됩니다.
   저장된 게 없으면 위의 GAME_DATA 기본값 + assets/ 폴더를 사용합니다. */
const LS_KEY = "ED_GAME_DATA", DB_NAME = "ED_STUDIO", DB_STORE = "assets";
let D, CFG, BASE;
const ASSETS = {};                       // 업로드 파일명 → objectURL
const url = f => (f && ASSETS[f]) ? ASSETS[f] : (BASE + f);

function idbOpen(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=>{ const db=r.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
async function loadUploadedAssets(){
  try{
    const db = await idbOpen();
    await new Promise(res=>{
      const st = db.transaction(DB_STORE,"readonly").objectStore(DB_STORE);
      const req = st.openCursor();
      req.onsuccess = e=>{
        const c = e.target.result;
        if(c){
          const v = c.value;
          const blob = (v && v.blob) ? v.blob : v;
          if(blob instanceof Blob) ASSETS[c.key] = URL.createObjectURL(blob);
          c.continue();
        } else res();
      };
      req.onerror = ()=>res();
    });
  }catch(e){ /* IndexedDB 미지원/차단 시 기본 assets/ 폴더 사용 */ }
}
function fillDefaults(obj){
  obj.config = obj.config || {};
  obj.config.assetBase = obj.config.assetBase || GAME_DATA.config.assetBase;
  obj.config.sfx = Object.assign({}, GAME_DATA.config.sfx, obj.config.sfx||{});
  obj.config.font = obj.config.font || GAME_DATA.config.font;
  obj.config.birthdaySong = obj.config.birthdaySong || GAME_DATA.config.birthdaySong;
  obj.config.models = Object.assign({}, GAME_DATA.config.models, obj.config.models||{});
  obj.videoLetter = Object.assign({}, GAME_DATA.videoLetter, obj.videoLetter||{});
  obj.montages = obj.montages || [];
  obj.starfall = obj.starfall || GAME_DATA.starfall;
  obj.certificate = obj.certificate || GAME_DATA.certificate;
  obj.credits = obj.credits || GAME_DATA.credits;
  return obj;
}
/* 설정 우선순위:
   1) 이 브라우저의 관리자 저장본(localStorage)
   2) 코드에 내장된 기본값(GAME_DATA) */
function loadSavedData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const obj = JSON.parse(raw);
      if(obj && obj.episodes && obj.flow) return fillDefaults(obj);
    }
  }catch(e){}
  return GAME_DATA;
}

/* ---------------- 오디오 ---------------- */
let actx = null;
const bgmEl = { cur:null };
const sfxFiles = {};
function initAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  // 지정된 SFX 파일 로드 시도 (없으면 내장 사운드로 대체)
  for(const k in CFG.sfx){
    if(!CFG.sfx[k]) continue;
    const a = new Audio(url(CFG.sfx[k]));
    a.addEventListener("canplaythrough", ()=>{ sfxFiles[k]=a; }, {once:true});
    a.addEventListener("error", ()=>{}, {once:true});
    a.load();
  }
}
/* 오디오 볼륨 페이드 (크로스페이드용) */
function fadeAudio(a, to, ms, then){
  if(!a){ if(then) then(); return; }
  const from = a.volume, t0 = performance.now();
  (function step(){
    const k = Math.min(1, (performance.now()-t0)/ms);
    a.volume = Math.min(1, Math.max(0, from + (to-from)*k));
    if(k < 1) requestAnimationFrame(step);
    else if(then) then();
  })();
}
function playBGM(file){
  // 기존 곡은 서서히 사라지고, 새 곡은 서서히 커짐 (크로스페이드)
  const old = bgmEl.cur; bgmEl.cur = null;
  if(old) fadeAudio(old, 0, 950, ()=>old.pause());
  if(!file) return;
  const a = new Audio(url(file));
  a.loop = true; a.volume = 0;
  a.addEventListener("error", ()=>{});
  a.play().catch(()=>{});
  fadeAudio(a, 0.45, 950);
  bgmEl.cur = a;
}
function stopBGM(){
  const old = bgmEl.cur; bgmEl.cur = null;
  if(old) fadeAudio(old, 0, 750, ()=>old.pause());
}

/* ---- 생일 축하 노래 (파일이 없으면 내장 멜로디로 자동 대체) ---- */
let bdayAudio=null, bdayTimers=[];
function synthBirthday(){
  const N={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
  const seq=[["G4",.35],["G4",.35],["A4",.7],["G4",.7],["C5",.7],["B4",1.3],
             ["G4",.35],["G4",.35],["A4",.7],["G4",.7],["D5",.7],["C5",1.3],
             ["G4",.35],["G4",.35],["G5",.7],["E5",.7],["C5",.7],["B4",.7],["A4",1.2],
             ["F5",.35],["F5",.35],["E5",.7],["C5",.7],["D5",.7],["C5",1.4]];
  let t=0;
  seq.forEach(([n,d])=>{
    bdayTimers.push(setTimeout(()=>tone(N[n], d*.92, "triangle", .07), t*1000));
    t += d;
  });
}
function startBirthdaySong(){
  stopBirthdaySong();
  const f = CFG.birthdaySong;
  if(!f){ synthBirthday(); return; }
  let failed=false;
  bdayAudio = new Audio(url(f));
  bdayAudio.volume = .6;
  bdayAudio.addEventListener("error", ()=>{ if(!failed){ failed=true; bdayAudio=null; synthBirthday(); } });
  bdayAudio.play().catch(()=>{ if(!failed){ failed=true; bdayAudio=null; synthBirthday(); } });
}
function stopBirthdaySong(){
  if(bdayAudio){ const a=bdayAudio; bdayAudio=null; fadeAudio(a, 0, 600, ()=>a.pause()); }

function tone(freq, dur, type, vol, slide){
  if(!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"square"; o.frequency.value = freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, actx.currentTime+dur);
  g.gain.setValueAtTime(vol||0.05, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+dur);
}
function sfx(name){
  const f = sfxFiles[name];
  if(f){ const c = f.cloneNode(); c.volume = .6; c.play().catch(()=>{}); return; }
  if(name==="typing")  tone(300+Math.random()*260, .07, "square", .04);
  if(name==="click")   tone(620, .09, "sine", .06, 240);
  if(name==="shutter"){
    if(!actx) return;
    const len = actx.sampleRate*0.12, buf = actx.createBuffer(1,len,actx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s = actx.createBufferSource(), g = actx.createGain();
    g.gain.value=.3; s.buffer=buf; s.connect(g); g.connect(actx.destination); s.start();
    tone(1200,.05,"square",.05);
  }
}

const PASTELS = [["#FBE3C9","#F2A6A0"],["#D9EEDB","#7FBF7F"],["#E3E7FB","#9BA9E0"],["#FBEFD3","#E8A33D"],["#F6DEE9","#DE9BC0"]];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return Math.abs(h); }
function placeholderCanvas(file, label){
  const c = document.createElement("canvas"); c.width=640; c.height=480;
  const g = c.getContext("2d");
  const p = PASTELS[hashStr(file)%PASTELS.length];
  const gr = g.createLinearGradient(0,0,640,480); gr.addColorStop(0,p[0]); gr.addColorStop(1,p[1]);
  g.fillStyle=gr; g.fillRect(0,0,640,480);
  g.strokeStyle="rgba(255,255,255,.8)"; g.lineWidth=5; g.setLineDash([16,12]);
  g.strokeRect(24,24,592,432);
  g.fillStyle="rgba(91,74,58,.85)"; g.textAlign="center";
  g.font="64px sans-serif"; g.fillText("📷", 320, 210);
  g.font="bold 30px sans-serif"; g.fillText(label||"사진 준비 중", 320, 276);
  g.font="19px monospace"; g.fillText("assets/"+file, 320, 320);
  return c;
}
// <img> 또는 플레이스홀더 canvas를 콜백으로 전달
function photoElement(file, label, cb){
  if(!file){ cb(placeholderCanvas("(비어 있음)", label)); return; }
  const img = new Image();
  img.onload  = ()=>cb(img);
  img.onerror = ()=>cb(placeholderCanvas(file,label));
  img.src = url(file);
}

/* ---- 쿼터뷰 카메라: 드래그 360도 회전 + 휠/핀치 줌 (GDD 2.1) ---- */
const orbit = { theta: Math.PI/4, phi: Math.PI/3.4, radius: 9, target: new THREE.Vector3(0,1,0) };
function applyOrbit(){
  const {theta, phi, radius, target} = orbit;
  camera.position.set(
    target.x + radius*Math.sin(phi)*Math.sin(theta),
    target.y + radius*Math.cos(phi),
    target.z + radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
/* 원하는 카메라 위치·바라볼 지점을 orbit 파라미터로 환산해 적용 */
function orbitLookFrom(camPos, lookAt){
  const off = camPos.clone().sub(lookAt);
  orbit.radius = off.length();
  orbit.phi    = Math.acos(Math.min(1, Math.max(-1, off.y/orbit.radius)));
  orbit.theta  = Math.atan2(off.x, off.z);
  orbit.target.copy(lookAt);
}
let dragging=false, moved=0, lastX=0, lastY=0, pinchDist=0;
canvas.addEventListener("pointerdown", e=>{ dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY; });
addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  moved += Math.abs(dx)+Math.abs(dy);
  lastX=e.clientX; lastY=e.clientY;
  orbit.theta -= dx*0.006;
  orbit.phi = Math.min(Math.PI/2.05, Math.max(0.5, orbit.phi - dy*0.005));
});
addEventListener("pointerup", e=>{
  if(dragging && moved < 8) handleTap(e.clientX, e.clientY);
  dragging=false;
});
canvas.addEventListener("wheel", e=>{
  orbit.radius = Math.min(16, Math.max(4.5, orbit.radius + e.deltaY*0.01));
}, {passive:true});
canvas.addEventListener("touchmove", e=>{
  if(e.touches.length===2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDist) orbit.radius = Math.min(16, Math.max(4.5, orbit.radius + (pinchDist-d)*0.02));
    pinchDist = d;
  }
}, {passive:true});
canvas.addEventListener("touchend", ()=>{ pinchDist=0; }, {passive:true});

/* ---------------- 트윈/시퀀스 유틸 ---------------- */
const tweens = [];
const easeIO = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function tween(dur, onUpdate, onDone, ease){
  tweens.push({t0:performance.now(), dur, onUpdate, onDone, ease:ease||easeIO});
}
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function tweenP(dur, onUpdate, ease){ return new Promise(r=>tween(dur,onUpdate,r,ease)); }

const TEX_HEART = heartTexture(), TEX_SNOW = dotTexture("#fff"), TEX_SPARK = dotTexture("#ffe27a"), TEX_GLOW = glowTexture();
const liveParticles = [];
function burst(pos, tex, n, speed, life){
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  for(let i=0;i<n;i++){
    const s = new THREE.Sprite(mat.clone());
    s.position.copy(pos);
    s.scale.setScalar(.28+Math.random()*.2);
    const v = new THREE.Vector3((Math.random()-.5)*speed, speed*(.7+Math.random()*.6), (Math.random()-.5)*speed);
    liveParticles.push({s,v,life:life||1.4,age:0});
    scene.add(s);
  }
}
function updateParticles(dt){
  for(let i=liveParticles.length-1;i>=0;i--){
    const p=liveParticles[i];
    p.age+=dt;
    p.s.position.addScaledVector(p.v, dt);
    p.v.y -= 0.6*dt;
    p.s.material.opacity = Math.max(0, 1-p.age/p.life);
    if(p.age>=p.life){ scene.remove(p.s); liveParticles.splice(i,1); }
  }
}
let snowPoints=null;
function addSnow(){
  const n=260, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){ pos[i*3]=(Math.random()-.5)*16; pos[i*3+1]=Math.random()*8; pos[i*3+2]=(Math.random()-.5)*16; }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos,3));
  snowPoints=new THREE.Points(geo, new THREE.PointsMaterial({map:TEX_SNOW,size:.14,transparent:true,opacity:.85,depthWrite:false}));
  scene.add(snowPoints);
}
function updateSnow(dt){
  if(!snowPoints) return;
  const a=snowPoints.geometry.attributes.position;
  for(let i=0;i<a.count;i++){
    let y=a.getY(i)-dt*1.1;
    if(y<0) y=8;
    a.setY(i,y);
  }
  a.needsUpdate=true;
}

const TEX_MARK = markerTex();
function setMarker(obj, yOff){
  clearMarker();
  if(!obj) return;
  marker = new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_MARK, transparent:true, depthTest:false}));
  marker.scale.setScalar(.6);
  marker.renderOrder = 999;
  markerTarget = {obj, yOff:yOff==null?1.4:yOff};
  scene.add(marker);
}
function clearMarker(){ if(marker){ scene.remove(marker); marker=null; markerTarget=null; } }
function updateMarker(t){
  if(!marker||!markerTarget) return;
  const p=new THREE.Vector3(); markerTarget.obj.getWorldPosition(p);
  marker.position.set(p.x, p.y+markerTarget.yOff + Math.sin(t*4)*.09, p.z);
}

    bang.position.set(0,1.2,.06); bang.rotation.x=.5; g.add(bang);

    const hair=new THREE.Mesh(new THREE.SphereGeometry(.48,22,18,0,Math.PI*2,0,Math.PI*.52), mat(opt.hair));
    hair.position.y=1.18; g.add(hair);
  }

    leg.position.set(.17*s,.08,0); g.add(leg);

  return g;
}

function gradientTex(top, bottom){
  const c=document.createElement("canvas"); c.width=4; c.height=128;
  const g=c.getContext("2d"); const gr=g.createLinearGradient(0,0,0,128);
  gr.addColorStop(0,top); gr.addColorStop(1,bottom);
  g.fillStyle=gr; g.fillRect(0,0,4,128);
  return new THREE.CanvasTexture(c);
}

/* ---------------- 3D 모델 슬롯 (GLB) ----------------
   업로드/파일이 있으면 캐릭터·배경을 자동 교체합니다. 없으면 기본 도형 유지. */
const modelCache = {};
function loadModel(file){
  if(!file || !window.THREE || !THREE.GLTFLoader) return Promise.resolve(null);
  if(modelCache[file]) return modelCache[file];
  modelCache[file] = new Promise(res=>{
    try{
      new THREE.GLTFLoader().load(url(file), g=>res(g.scene||null), undefined, ()=>res(null));
    }catch(e){ res(null); }
  });
  return modelCache[file];
}
// 크기·위치 정규화: targetH(높이 맞춤) 또는 targetW(가로폭 맞춤), 바닥을 y=0에
function normalizeModel(obj, targetH, targetW){
  const box=new THREE.Box3().setFromObject(obj);
  const size=box.getSize(new THREE.Vector3());
  let s=1;
  if(targetH && size.y>0) s = targetH/size.y;
  else if(targetW){ const w=Math.max(size.x,size.z)||1; s = targetW/w; }
  obj.scale.setScalar(s);
  const box2=new THREE.Box3().setFromObject(obj);
  const c=box2.getCenter(new THREE.Vector3());
  obj.position.x -= c.x;
  obj.position.z -= c.z;
  obj.position.y -= box2.min.y;
  obj.traverse(m=>{ if(m.isMesh){ m.castShadow=true; m.receiveShadow=true; } });
  return obj;
}
// 캐릭터 교체: 이동/회전 로직이 걸린 그룹은 유지하고 내용물만 모델로
function dressChar(group, file, height){
  const gen=sceneGen;
  loadModel(file).then(model=>{
    if(!model || gen!==sceneGen || !group.parent) return;
    while(group.children.length) group.remove(group.children[0]);
    group.add(normalizeModel(model.clone(true), height));
  });
}
// 배경 교체: 장식(벽·바닥·소품)은 숨기고, 클릭 대상·캐릭터·하늘·조명·파티클은 유지
function hideDecor(){
  const keep=new Set(Object.values(interactives));
  if(charDobby) keep.add(charDobby);
  if(charEngju) keep.add(charEngju);
  scene.children.forEach(o=>{
    if(o.isLight || o.isPoints || o.isSprite || o.isLine || o.name==="SKY") return;
    if(keep.has(o)) return;
    o.visible=false;
  });
}
function applyCustomModels(bgKey){
  const mf = CFG.models || {};
  if(charDobby && mf.dobby) dressChar(charDobby, mf.dobby, 1.7);
  if(charEngju && mf.engju) dressChar(charEngju, mf.engju, 1.65);
  const envFile = mf[bgKey];
  if(!envFile) return;
  const gen=sceneGen;
  loadModel(envFile).then(model=>{
    if(!model || gen!==sceneGen) return;
    hideDecor();
    scene.add(normalizeModel(model.clone(true), null, 9));
  });
}

const dlgBox=$("dialogue-box"), dlgText=$("dlg-text"), dlgNext=$("dlg-next"), spkPlate=$("speaker-plate");
let dlgResolver=null, typingTimer=null, typingFull="", typingDone=false;
function fmtLine(line){
  // (지문) 부분을 옅은 색으로
  return line.replace(/\(([^)]*)\)/g, '<span class="direction">($1)</span>');
}
function showLine(speaker, line){
  return new Promise(res=>{
    dlgBox.classList.remove("hidden");
    spkPlate.textContent = speaker;
    spkPlate.className = "speaker-plate" + (speaker==="엥주"?" engju":((speaker==="SYSTEM"||speaker==="나레이션")?" system":""));
    dlgNext.style.visibility="hidden";
    typingFull = line; typingDone=false;
    let i=0; dlgText.innerHTML="";
    clearInterval(typingTimer);
    typingTimer=setInterval(()=>{
      i++;
      dlgText.innerHTML = fmtLine(line.slice(0,i));
      if(line[i-1] && line[i-1]!==" ") sfx("typing");
      if(i>=line.length){ clearInterval(typingTimer); typingDone=true; dlgNext.style.visibility="visible"; }
    }, 38);
    dlgResolver = res;
  });
}
dlgBox.addEventListener("pointerup", e=>{
  e.stopPropagation();
  if(!typingDone){
    clearInterval(typingTimer);
    dlgText.innerHTML = fmtLine(typingFull);
    typingDone=true; dlgNext.style.visibility="visible";
    return;
  }
  if(dlgResolver){ const r=dlgResolver; dlgResolver=null; sfx("click"); r(); }
});

/* ---- 동물의 숲 과일 6종 (로우폴리) ---- */
function makeFruit(type){
  const g=new THREE.Group();
  const add=(mesh)=>{ g.add(mesh); return mesh; };
  const stem=()=>{ const st=new THREE.Mesh(new THREE.CylinderGeometry(.015,.02,.09,6), toon(0x6e4a2e)); st.position.y=.17; g.add(st); };
  const leaf=()=>{ const lf=new THREE.Mesh(new THREE.SphereGeometry(.05,8,6), toon(0x63a862)); lf.scale.set(1.6,.5,.8); lf.position.set(.05,.19,0); g.add(lf); };
  if(type==="apple"){ add(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10), toon(0xe0453a))); stem(); leaf(); }
  else if(type==="orange"){ const o=add(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10), toon(0xf59a23))); o.scale.y=.92; stem(); }
  else if(type==="peach"){ add(new THREE.Mesh(new THREE.SphereGeometry(.15,12,10), toon(0xf7b2c1))); stem(); leaf(); }
  else if(type==="pear"){ const b=add(new THREE.Mesh(new THREE.SphereGeometry(.14,12,10), toon(0xc9d24b))); b.scale.y=1.15; b.position.y=-.02;
    const t=add(new THREE.Mesh(new THREE.SphereGeometry(.09,10,8), toon(0xc9d24b))); t.position.y=.12; stem(); }
  else if(type==="cherry"){ const c1=add(new THREE.Mesh(new THREE.SphereGeometry(.1,10,8), toon(0xc22b3f))); c1.position.set(-.07,0,0);
    const c2=add(new THREE.Mesh(new THREE.SphereGeometry(.1,10,8), toon(0xc22b3f))); c2.position.set(.08,-.02,0);
    const s1=add(new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.16,6), toon(0x6e4a2e))); s1.position.set(-.04,.12,0); s1.rotation.z=.25;
    const s2=add(new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.16,6), toon(0x6e4a2e))); s2.position.set(.05,.11,0); s2.rotation.z=-.2; leaf(); }
  else { // coconut — 특별한 추억(해외) 전용
    const c=add(new THREE.Mesh(new THREE.SphereGeometry(.16,12,10), toon(0x8a6a44))); c.scale.y=1.1;
    for(let i=0;i<3;i++){ const d=add(new THREE.Mesh(new THREE.CircleGeometry(.025,8), new THREE.MeshBasicMaterial({color:0x4a3520})));
      d.position.set(-.04+i*.045,.1,.14); d.lookAt(d.position.x*3,1,2); } }
  g.traverse(m=>{ if(m.isMesh) m.castShadow=true; });
  return g;
}
const FRUIT_CYCLE=["apple","orange","peach","pear","cherry"];  // 코코넛은 slide에 fruit:"coconut" 지정 시에만

async function runMontage(m){
  await fadeIn();
  const tree = buildOrchard();
  applyCustomModels("orchard");
  applyOrbit();
  await fadeOut();
  playBGM(m.bgm);
  await showIntro({date:"─ 추억의 정원 ─", location:m.title||"우리의 이야기"});
  const slides = m.slides||[];
  // 과일 열매 매달기 (종류는 5종 순환, coconut은 지정된 슬라이드만)
  const fruits=[];
  let cyc=0;
  slides.forEach((s,i)=>{
    const type = s.fruit || FRUIT_CYCLE[(cyc++)%FRUIT_CYCLE.length];
    const f = makeFruit(type);
    const a = i/Math.max(1,slides.length)*Math.PI*2 + .6;
    const r = .95+(i%3)*.32;
    f.position.set(Math.cos(a)*r, 2.5+Math.sin(i*2.3)*.55, Math.sin(a)*r*.85);
    tree.add(f); fruits.push(f);
  });
  // ── 1) 나무를 한 번 힘껏 흔들면 전부 우르르 낙하 ──
  hint("나무를 눌러 힘껏 흔들어보세요!");
  setMarker(tree, 4.5);
  tapLocked=false; currentTargetName="OBJ_TREE";
  await new Promise(r=>{ onTargetHit=r; });
  tapLocked=true; currentTargetName=null; clearMarker();
  sfx("click");
  await tweenP(850, k=>{ tree.rotation.z = Math.sin(k*Math.PI*8)*.11*(1-k*.6); });
  tree.rotation.z=0;
  // 낙하 지점: 날짜 순서대로 나무 앞에 부채꼴로 가지런히
  const drops = fruits.map((f,i)=>{
    const wp=new THREE.Vector3(); f.getWorldPosition(wp);
    tree.remove(f); f.position.copy(wp); scene.add(f);
    const n=slides.length, t=(n<=1)?.5:i/(n-1);
    return { f, from:wp, to:new THREE.Vector3(-2.7+5.4*t, .16, 2.0+Math.sin(t*Math.PI)*.7) };
  });
  await Promise.all(drops.map((d,i)=>new Promise(res=>{
    setTimeout(()=>{
      tweenP(700, k=>{
        d.f.position.x = d.from.x+(d.to.x-d.from.x)*k;
        d.f.position.z = d.from.z+(d.to.z-d.from.z)*k;
        d.f.position.y = d.from.y+(d.to.y-d.from.y)*(k*k) + Math.abs(Math.sin(k*Math.PI*1.5))*(1-k)*.5;
        d.f.rotation.z = k*(i%2?1:-1)*1.2;
      }, t=>t).then(()=>{ burst(d.f.position.clone(), TEX_SPARK, 4, .8, .7); res(); });
    }, i*110);
  })));
  sfx("shutter");
  // ── 2) 빛나는 과일부터 차례대로 줍기 (날짜 순서) ──
  for(let i=0;i<slides.length;i++){
    hint(`✨ 빛나는 과일을 주워요 ( ${i} / ${slides.length} )`);
    const f=fruits[i];
    // 현재 과일에만 글로우 + 콩콩 점프
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false, opacity:.9}));
    glow.position.copy(f.position); glow.position.y+=.15; scene.add(glow);
    let pulsing=true, pt=0;
    const pulse=setInterval(()=>{ pt+=.12;
      glow.scale.setScalar(.9+Math.sin(pt*3)*.25);
      glow.material.opacity=.6+Math.sin(pt*3)*.3;
      f.position.y = .16 + Math.abs(Math.sin(pt*2))*.12;
    }, 33);
    interactives.OBJ_FRUIT = f;
    tapLocked=false; currentTargetName="OBJ_FRUIT";
    await new Promise(r=>{ onTargetHit=r; });
    tapLocked=true; currentTargetName=null;
    clearInterval(pulse); pulsing=false; scene.remove(glow);
    delete interactives.OBJ_FRUIT;
    // 줍기 연출: 과일이 통통 튀어오르며 사라짐
    sfx("click");
    const fp=f.position.clone();
    await tweenP(380, k=>{ f.position.y=fp.y+k*1.2; f.rotation.y=k*4; f.scale.setScalar(1-k*.5); });
    burst(f.position.clone(), TEX_SPARK, 8, 1.1, 1);
    scene.remove(f);
    await showPhoto(slides[i].photo, slides[i].date, slides[i].caption);
  }
  hint(null);
  burst(new THREE.Vector3(0,3,0), TEX_HEART, 14, 1.6, 2);
  await wait(1000);
}

async function runStarfall(sf){
  await fadeIn(); buildStarfall(); applyCustomModels("starfall"); applyOrbit(); await fadeOut();
  playBGM(sf.bgm);
  await showIntro({date:"─ 밤하늘 ─", location: sf.title||"별똥별에 비는 소원"});
  const wishes = sf.wishes||[];
  let got=0, active=false;
  const wishEl=$("wish");
  const updateHint=()=>hint(`✨ 반짝이는 곳을 주목! 별똥별이 지나갈 때 탭 ( ${got} / ${wishes.length} )`);
  updateHint();
  minigameTap = ()=>{
    if(!active){ tone(220,.08,"sine",.03); return; }
    active=false; got++;
    tone(880,.5,"sine",.06,1760);
    wishEl.textContent = "★ " + wishes[got-1];
    wishEl.classList.add("show");
    setTimeout(()=>wishEl.classList.remove("show"), 3400);
    updateHint();
  };
  // 지금 카메라가 보는 화면 기준 좌표(nx,ny: -1~1)를 하늘 위 월드 좌표로 변환
  const skyPoint=(nx,ny)=>{
    const v=new THREE.Vector3(nx,ny,.5).unproject(camera);
    const dir=v.sub(camera.position).normalize();
    return camera.position.clone().addScaledVector(dir, 30);
  };
  while(got < wishes.length){
    await wait(1100 + Math.random()*1300);
    // 항상 화면 안 하늘에서 등장하도록 위치 계산
    const nx=-.25+Math.random()*.5, ny=.4+Math.random()*.3;
    const from=skyPoint(nx, ny);
    const to=skyPoint(nx-.5, ny-.38);
    // ── 예고: 그 자리에서 반짝임이 점점 커짐 ──
    const cue=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false}));
    cue.position.copy(from); cue.scale.setScalar(.1); scene.add(cue);
    tone(1560,.18,"sine",.045);   // 반짝 예고음
    await tweenP(900, k=>{
      cue.scale.setScalar(.2 + Math.sin(k*Math.PI*3)*.5 + k*1.4);
      cue.material.opacity = .5 + Math.sin(k*Math.PI*6)*.5;
    }, t=>t);
    scene.remove(cue);
    // ── 별똥별 낙하 — 크고 밝은 머리 + 긴 꼬리 ──
    tone(1320,.35,"sine",.05,1980);
    const head=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false}));
    head.scale.setScalar(2.6);
    head.position.copy(from); scene.add(head);
    const dir=to.clone().sub(from).normalize();
    // 꼬리 (뒤로 갈수록 작고 옅어짐)
    const tail=[];
    for(let t=0;t<7;t++){
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX_GLOW, transparent:true, depthWrite:false}));
      sp.scale.setScalar(1.9 - t*0.22);
      sp.material.opacity = .8 - t*.1;
      sp.position.copy(from); scene.add(sp); tail.push(sp);
    }
    active=true;
    await tweenP(1650, k=>{
      head.position.lerpVectors(from,to,k);
      tail.forEach((sp,t)=>{
        sp.position.copy(head.position).addScaledVector(dir, -(t+1)*0.85);
      });
      if(k>.78){
        const f=1-(k-.78)/.22;
        head.material.opacity=f;
        tail.forEach((sp,t)=>{ sp.material.opacity=(.8-t*.1)*f; });
      }
    }, t=>t);
    active=false;
    scene.remove(head); tail.forEach(sp=>scene.remove(sp));
  }
  minigameTap=null;
  hint(null);
  burst(new THREE.Vector3(0,2.6,0), TEX_HEART, 12, 1.4, 2);
  await wait(1400);
}

  const cam0={tx:orbit.target.x, ty:orbit.target.y, tz:orbit.target.z, r:orbit.radius, th:orbit.theta};

  burst(bottle.position.clone().add(new THREE.Vector3(0,.4,0)), TEX_SPARK, 8, 1.2, 1);

/* ---------------- 하트 콜라주 (피날레 · 소용돌이 응축 뒤) ----------------
   사진들이 하나의 하트 모양으로 배열되어 정지. 개별 사진을 탭하면 확대되고,
   확대 상태에서 좌우 스와이프(또는 ◀▶)로 다음/이전 사진을 넘겨볼 수 있음. */
function showHeartCollage(files){
  return new Promise(res=>{
    const ov=$("heart-collage"), board=$("hc-board");
    const vw=$("hc-viewer"), vwPhoto=$("hcv-photo"), vwCount=$("hcv-count");
    board.innerHTML="";
    const N=files.length;
    if(!N){ res(); return; }
    // 하트 곡선 위에 사진을 고르게 배치 (x=16sin³t, y=13cos t−5cos2t−2cos3t−cos4t)
    files.forEach((ph,i)=>{
      const t=(i/N)*Math.PI*2;
      const hx=16*Math.pow(Math.sin(t),3);
      const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      const cell=document.createElement("div"); cell.className="hc-photo";
      cell.style.left=(50+hx*2.55)+"%";
      cell.style.top =(46-hy*2.35)+"%";
      const rot=((i*47)%11)-5;   // 살짝 흐트러진 손맛 (고정 시드)
      cell.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`;
      cell.style.animationDelay=(i*80)+"ms";
      photoElement(ph.file, ph.label, el=>cell.appendChild(el));
      cell.addEventListener("pointerup", e=>{ e.stopPropagation(); sfx("click"); openViewer(i); });
      board.appendChild(cell);
    });
    // ---- 확대 뷰어 ----
    let cur=0;
    function renderViewer(){
      const ph=files[cur];
      vwPhoto.innerHTML="";
      photoElement(ph.file, ph.label, el=>{
        vwPhoto.appendChild(el);
        const cap=document.createElement("div"); cap.className="hcv-cap";
        cap.textContent=ph.label||""; vwPhoto.appendChild(cap);
      });
      vwCount.textContent=(cur+1)+" / "+N;
    }
    function openViewer(i){ cur=i; renderViewer(); vw.classList.remove("hidden"); }
    function closeViewer(){ vw.classList.add("hidden"); }
    function go(d){ sfx("click"); cur=(cur+d+N)%N; renderViewer(); }
    $("hcv-prev").onclick = e=>{ e.stopPropagation(); go(-1); };
    $("hcv-next").onclick = e=>{ e.stopPropagation(); go(1); };
    // 스와이프로 넘기기 · 바깥 탭으로 닫기
    let sx=null;
    vw.onpointerdown = e=>{ sx=e.clientX; };
    vw.onpointerup = e=>{
      if(sx===null) return;
      const dx=e.clientX-sx; sx=null;
      if(Math.abs(dx)>48){ go(dx<0?1:-1); return; }
      if(e.target===vw){ sfx("click"); closeViewer(); }   // 사진/버튼 밖 탭 → 콜라주 복귀
    };
    ov.classList.remove("hidden");
    $("btn-hc-done").onclick = ()=>{
      sfx("click"); closeViewer(); ov.classList.add("hidden"); res();
    };
  });
}

function runCredits(lines){

    const ov=$("credits"), col=$("credits-col");
    col.innerHTML="";

    let pi=0;
    (lines||[]).forEach((t,i)=>{

      if(t.indexOf("예식일")===0) d.classList.add("wedding");   // 결혼식 날짜는 금빛 강조
      col.appendChild(d);
      if(i%2===1 && pi<photos.length){
        const w=document.createElement("div"); w.className="cr-photo";
        photoElement(photos[pi].file, photos[pi].label, el=>w.appendChild(el));
        col.appendChild(w); pi++;
      }
    });
    const end=document.createElement("div"); end.className="cr-line end";
    end.textContent="…그리고, 계속될 우리의 이야기 ♥"; col.appendChild(end);
    ov.classList.remove("hidden");
    let skip=false;
    ov.onpointerup = ()=>{ skip=true; };
    const t0=performance.now();
    requestAnimationFrame(function step(){
      const H=col.offsetHeight;
      const dur=Math.max(14000, H*18);
      const k=Math.min(1,(performance.now()-t0)/dur);
      col.style.transform=`translate(-50%, ${innerHeight - (innerHeight+H)*k}px)`;
      if(k>=1 || skip){ ov.classList.add("hidden"); res(); }
      else requestAnimationFrame(step);
    });
  });
}

/* ---------------- UI: 영상편지 ---------------- */
function playVideoLetter(){
  return new Promise(res=>{
    const vl=D.videoLetter;
    const ov=$("video-letter"), frame=$("vl-frame"), skipBtn=$("btn-vl-skip"), fsBtn=$("btn-vl-fs");
    frame.innerHTML="";
    ov.classList.remove("hidden");
    skipBtn.style.display = vl.skippable ? "" : "none";
    fsBtn.style.display = "none";   // 영상이 실제로 재생 가능할 때만 표시
    let done=false;
    const finish=()=>{ if(done)return; done=true;
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      const v=frame.querySelector("video"); if(v) v.pause();
      ov.classList.add("hidden"); res(); };
    skipBtn.onclick = ()=>{ sfx("click"); finish(); };
    if(!vl.file){ finish(); return; }
    const v=document.createElement("video");
    v.src = url(vl.file);
    v.playsInline = true; v.controls = false; v.autoplay = true;
    fsBtn.onclick = ()=>{
      sfx("click");
      if(v.requestFullscreen) v.requestFullscreen().catch(()=>{});
      else if(v.webkitRequestFullscreen) v.webkitRequestFullscreen();
      else if(v.webkitEnterFullscreen) v.webkitEnterFullscreen();   // iOS Safari
    };
    v.addEventListener("ended", ()=>setTimeout(finish, 500));
    v.addEventListener("error", ()=>{
      // 영상 파일이 아직 없을 때: 자리 표시 + 계속 버튼
      frame.innerHTML =
        '<div class="vl-missing"><b>영상편지 자리예요 🎬</b><br><br>' +
        '<span><code>'+BASE+vl.file+'</code> 파일을 넣으면<br>이 자리에서 영상편지가 재생됩니다.</span></div>';
      skipBtn.textContent="계속하기";
      skipBtn.style.display="";
    });
    v.addEventListener("canplay", ()=>{ v.play().catch(()=>{}); fsBtn.style.display=""; });
    frame.appendChild(v);
  });
}

/* 캐릭터를 수평으로만 회전시켜 (x,z)를 바라보게 함.
   lookAt은 때때로 180° 뒤집힌 오일러 표현을 만들고, 매 프레임 idle 애니메이션이
   z축만 덮어쓰면서 캐릭터가 실제로 뒤집혀 땅에 묻히는 버그가 있어 이 헬퍼로 대체. */
function faceTo(obj, x, z){
  obj.rotation.set(0, Math.atan2(x-obj.position.x, z-obj.position.z), 0);
}
function moveChar(ch, to, dur){
  const from = ch.position.clone();
  faceTo(ch, to.x, to.z);
  return tweenP(dur, k=>{
    ch.position.lerpVectors(from, to, k);
    ch.position.y = from.y + Math.abs(Math.sin(k*Math.PI*4))*.12; // 총총 걸음
  });
}

  if(minigameTap){ minigameTap(); return; }
  if(tapLocked || !currentTargetName) return;
  const t = interactives[currentTargetName];
  if(!t) return;
  pointer.x=(x/innerWidth)*2-1; pointer.y=-(y/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hits = raycaster.intersectObject(t, true);
  if(hits.length){ sfx("click"); onTargetHit(); }
}
let onTargetHit=()=>{};

/* ---------------- 에피소드 진행 ---------------- */
async function fadeIn(){ $("fader").style.opacity=1; await wait(850); }
async function fadeOut(){ $("fader").style.opacity=0; await wait(850); }

/* ---------------- 문래 오프닝 (창문 클로즈업 → 도비 등장) ----------------
   시작 화면: 창문 너머로 앉아 있는 엥주가 보이는 클로즈업.
   아무 곳이나 탭하면 카메라가 천천히 빠지며, 눈길 저편에서 도비가 걸어와
   창문 앞에 선다. 그 뒤 기존 프렐류드(문 열고 입장)로 이어짐. */
async function mullaeOpening(){
  if(!charDobby || charDobby.visible) return;
  hint("창문 너머, 그녀가 있어요... (화면을 탭)");
  await new Promise(r=>{ minigameTap=r; });
  minigameTap=null; hint(null); sfx("click");
  // 도비가 화면 밖(가로등 쪽)에서 걸어 들어옴 + 카메라 풀백 동시 진행
  charDobby.position.set(-6.4,0,2.8);
  faceTo(charDobby, -4.5, .35);
  charDobby.visible = true;
  const o0={theta:orbit.theta, phi:orbit.phi, r:orbit.radius,
            tx:orbit.target.x, ty:orbit.target.y, tz:orbit.target.z};
  const oT={theta:-Math.PI*0.4, phi:Math.PI/2.55, r:8.5, tx:-2.6, ty:1.15, tz:1.0};  // 눈높이에 가까운 각도 — 골목 저편 스카이라인·문래역이 함께 잡힘
  const cam = tweenP(2400, k=>{
    orbit.theta  = o0.theta + (oT.theta-o0.theta)*k;
    orbit.phi    = o0.phi   + (oT.phi  -o0.phi  )*k;
    orbit.radius = o0.r     + (oT.r    -o0.r    )*k;
    orbit.target.set(o0.tx+(oT.tx-o0.tx)*k, o0.ty+(oT.ty-o0.ty)*k, o0.tz+(oT.tz-o0.tz)*k);
  });
  const walk = (async()=>{
    await wait(600);
    await moveChar(charDobby, new THREE.Vector3(-4.5,0,.35), 1500);
    faceTo(charDobby, -3.6, .2);   // 창문을 바라봄
  })();
  await Promise.all([cam, walk]);
  // 유리 너머 그녀를 보며 — 작은 두근거림
  await tweenP(300, k=>{ charDobby.position.y = Math.sin(k*Math.PI)*.14; });
  burst(charDobby.position.clone().add(new THREE.Vector3(0,1.7,0)), TEX_HEART, 4, .9, 1.4);
  await wait(350);
}

async function runEpisode(ep){
  curEp = ep;
  await fadeIn();
  (BUILDERS[ep.background] || buildRoom)();
  applyCustomModels(ep.background);
  applyOrbit();
  await fadeOut();
  playBGM(ep.bgm);

  // 인터랙션 실행 루프 (phase:"prelude" → 라운드 인트로 카드보다 먼저 실행)
  async function runInts(list){
    for(const it of list){
      const target = interactives[it.target];
      if(!target || !ACTIONS[it.action]) continue;   // 이 배경에 없는 대상/액션이면 건너뜀
      hint(it.hint);
      setMarker(target, it.target.startsWith("CHAR") ? 1.5 : (it.target==="OBJ_DOOR" ? 2.7 : 1.0));
      tapLocked=false; currentTargetName = it.target;
      await new Promise(r=>{ onTargetHit=r; });
      tapLocked=true; currentTargetName=null;
      clearMarker(); hint(null);
      await ACTIONS[it.action]();
      if(it.dialogue && it.dialogue.length) await playDialogue(it.dialogue);
    }
  }
  const ints = ep.interactions || [];
  const preludes = ints.filter(i => i.phase === "prelude");
  if(ep.background==="mullae") await mullaeOpening();       // 창문 클로즈업 → 도비 등장
  await runInts(preludes);                                  // 문 열고 입장 등

  // 프렐류드(자체 카메라 연출)가 없는 라운드는 진입 시 카메라가 천천히
  // 다가가는 푸시인으로 통일감을 줌 (인트로 카드와 동시에 진행)
  let camIn = Promise.resolve();
  if(!preludes.length){
    const g={theta:orbit.theta, radius:orbit.radius, ty:orbit.target.y};
    orbit.theta  = g.theta - 0.32;
    orbit.radius = Math.min(16, g.radius + 3.0);
    orbit.target.y = g.ty + 0.5;
    camIn = tweenP(2400, k=>{
      orbit.theta    = (g.theta-0.32) + 0.32*k;
      orbit.radius   = Math.min(16, g.radius+3.0) + (g.radius - Math.min(16, g.radius+3.0))*k;
      orbit.target.y = (g.ty+0.5) - 0.5*k;
    });
  }
  await showIntro(ep);                                      // ← 입장하면 그때부터 라운드 시작
  await camIn;
  await runInts(ints.filter(i => i.phase !== "prelude"));

  if(ep.dialogue && ep.dialogue.length) await playDialogue(ep.dialogue);

  // 클리어 연출: 폴라로이드 (realPhotos 배열 — 여러 장 가능)
  for(const f of (ep.realPhotos||[])){
    await showPhoto(f, ep.date + " · " + ep.location);
  }

  // 에필로그: 유리병 편지 나레이션 (해변 배경 전용)
  if(ep.epilogue && ep.epilogue.narration && ep.epilogue.narration.length && ep.background==="beach"){
    await runBottleLetter(ep.epilogue);
  }

  if(ep.systemNotice){
    // 피날레: 평생 주민권 → 엔딩 크레딧 → 시스템 알림 (오디오 볼륨 유지)
    if(D.certificate && D.certificate.title) await showCertificate(D.certificate);
    if(D.credits && D.credits.length) await runCredits(D.credits);
    $("notice-main").textContent = ep.systemNotice;
    $("notice-sub").textContent = "— 우리의 진짜 이야기는 지금부터 —";
    $("final-notice").classList.remove("hidden");
    const gp=new THREE.Vector3(0,2,0);
    setInterval(()=>burst(gp.clone().add(new THREE.Vector3((Math.random()-.5)*3,0,(Math.random()-.5)*3)), TEX_HEART, 2, 1, 2.2), 900);
    return; // 흐름 종료 (BGM 유지)
  }
  nextFlow();
}

/* ---------------- 흐름 컨트롤러 ---------------- */
let flowIndex=0, curEp=null;
function nextFlow(){
  const id = D.flow[flowIndex++];
  if(!id) return;
  const ep = D.episodes.find(e=>e.id===id);
  if(ep){ runEpisode(ep); return; }
  const m = D.montages.find(x=>x.id===id);
  if(m){ runMontage(m).then(nextFlow); return; }
  if(D.starfall && D.starfall.id===id){ runStarfall(D.starfall).then(nextFlow); return; }
  console.warn("flow에 정의된 id를 찾을 수 없음:", id);
  nextFlow();
}

/* ---------------- 메인 루프 ---------------- */
let prev=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(.05,(now-prev)/1000); prev=now;
  // 트윈
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    const k=Math.min(1,(now-tw.t0)/tw.dur);
    tw.onUpdate(tw.ease(k));
    if(k>=1){ tweens.splice(i,1); if(tw.onDone) tw.onDone(); }
  }
  updateParticles(dt);
  updateSnow(dt);
  updateMarker(now/1000);
  // 캐릭터 아이들 모션 (살랑살랑)
  const idle=Math.sin(now/1000*2.2)*.02;
  if(charDobby) charDobby.rotation.z = idle;
  if(charEngju) charEngju.rotation.z = -idle;
  applyOrbit();
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

/* ---------------- 시작 ---------------- */
async function boot(){
  D = loadSavedData();                 // 이 브라우저 저장본 우선, 없으면 GAME_DATA
  CFG = D.config; BASE = CFG.assetBase || "assets/";
  await loadUploadedAssets();          // 관리자에서 업로드한 파일들
  loadFont();

  const first = D.episodes.find(e => e.id === D.flow[0]);
  (BUILDERS[first && first.background] || buildMullae)();   // 타이틀 뒤 배경
  applyOrbit();
  $("fader").style.opacity = 0;

  $("btn-start").addEventListener("click", ()=>{
    initAudio();
    sfx("click");
    $("title-screen").classList.add("hidden");
    nextFlow();
  });
}
boot();

})();
